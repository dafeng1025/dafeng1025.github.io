    <script>
        const PI = 3.14;
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // State
        let shapes = []; 
        let textLabels = []; 
        let annotations = []; 
        let selection = []; 
        
        // History State
        const history = [];
        let historyStep = -1;
        
        let isDragging = false;
        let isResizing = false;
        let isRotating = false;
        let dragOffsetX, dragOffsetY; 
        let dragStartPositions = []; 

        let interactionMode = 'geometry'; // geometry, drawing, text, eraser
        let drawingMode = 'freehand'; 
        let isErasing = false; 
        let isDrawing = false;
        
        let isSelecting = false;
        let selectionBox = { startX: 0, startY: 0, currentX: 0, currentY: 0 };

        let currentAnnotation = null;
        let straightLineStart = null;
        let straightLineEnd = null;
        let penColor = '#000000';
        let penWidth = 3;
        let eraserWidth = 20;
        
        let translateX = 0;
        let translateY = 0;
        let scale = 1;
        let isPanning = false;
        let lastMousePos = null; 

        // Helper: Offscreen canvas
        const helperCanvas = document.createElement('canvas');
        const helperCtx = helperCanvas.getContext('2d');

        // --- Classes ---
        class BitmapShape {
            constructor(imgData, x, y, w, h, color) {
                this.id = Date.now() + Math.random();
                this.type = 'FloodFill'; 
                this.x = x + w/2; 
                this.y = y + h/2;
                this.rotation = 0;
                this.color = color;
                this.alpha = 0.5; 
                this.w = w;
                this.h = h;
                
                this.isLocked = false; 
                this.isFixed = false;
                
                this.imgData = imgData;
                this.fillCanvas = document.createElement('canvas');
                this.fillCanvas.width = w;
                this.fillCanvas.height = h;
                const fCtx = this.fillCanvas.getContext('2d');
                fCtx.putImageData(imgData, 0, 0);
                fCtx.globalCompositeOperation = 'source-in';
                fCtx.fillStyle = color;
                fCtx.fillRect(0,0,w,h);
                
                this.outlineCanvas = document.createElement('canvas');
                this.outlineCanvas.width = w;
                this.outlineCanvas.height = h;
                const oCtx = this.outlineCanvas.getContext('2d');
                const outlineData = oCtx.createImageData(w, h);
                const src = imgData.data;
                const dst = outlineData.data;
                
                for (let i = 0; i < h; i++) {
                    for (let j = 0; j < w; j++) {
                        const idx = (i * w + j) * 4;
                        if (src[idx+3] > 0) { 
                            let isEdge = false;
                            if (i === 0 || src[((i-1)*w + j)*4 + 3] === 0) isEdge = true;
                            else if (i === h-1 || src[((i+1)*w + j)*4 + 3] === 0) isEdge = true;
                            else if (j === 0 || src[(i*w + j - 1)*4 + 3] === 0) isEdge = true;
                            else if (j === w-1 || src[(i*w + j + 1)*4 + 3] === 0) isEdge = true;
                            
                            if (isEdge) {
                                dst[idx] = 0;   
                                dst[idx+1] = 0; 
                                dst[idx+2] = 0; 
                                dst[idx+3] = 255; 
                            }
                        }
                    }
                }
                oCtx.putImageData(outlineData, 0, 0);
                
                this.lastColor = color;
            }
            
            updateColor() {
                const ctx = this.fillCanvas.getContext('2d');
                ctx.globalCompositeOperation = 'source-over';
                ctx.putImageData(this.imgData, 0, 0);
                ctx.globalCompositeOperation = 'source-in';
                ctx.fillStyle = this.color;
                ctx.fillRect(0, 0, this.w, this.h);
            }
            
            clone() {
                 const newImgData = new ImageData(
                     new Uint8ClampedArray(this.imgData.data),
                     this.imgData.width,
                     this.imgData.height
                 );
                 const copy = new BitmapShape(newImgData, this.x - this.w/2, this.y - this.h/2, this.w, this.h, this.color);
                 copy.alpha = this.alpha;
                 copy.rotation = this.rotation;
                 copy.isLocked = this.isLocked;
                 copy.isFixed = this.isFixed;
                 return copy;
            }

            draw() {
                if (this.lastColor !== this.color) {
                    this.updateColor();
                    this.lastColor = this.color;
                }
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.globalAlpha = this.alpha;
                ctx.drawImage(this.fillCanvas, -this.w/2, -this.h/2);
                
                ctx.globalAlpha = 1.0; 
                ctx.drawImage(this.outlineCanvas, -this.w/2, -this.h/2);
                
                ctx.restore();
                
                if (selection.includes(this)) this.drawSelectionHighlight();
            }
            
            drawSelectionHighlight() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2/scale; ctx.setLineDash([5/scale, 5/scale]);
                ctx.strokeRect(-this.w/2 - 2/scale, -this.h/2 - 2/scale, this.w + 4/scale, this.h + 4/scale);
                ctx.setLineDash([]); ctx.restore();
            }

            containsPoint(mx, my) {
                const dx = mx - this.x; const dy = my - this.y;
                const cos = Math.cos(-this.rotation); const sin = Math.sin(-this.rotation);
                const localX = dx * cos - dy * sin; const localY = dy * cos + dx * sin;
                if (localX < -this.w/2 || localX > this.w/2 || localY < -this.h/2 || localY > this.h/2) return false;
                const px = Math.floor(localX + this.w/2);
                const py = Math.floor(localY + this.h/2);
                if (px < 0 || px >= this.w || py < 0 || py >= this.h) return false;
                const index = (py * this.w + px) * 4 + 3;
                return this.imgData.data[index] > 0;
            }
            
            checkControls(mx, my) { 
                if (this.isLocked || this.isFixed) return null;
                return null; 
            }
        }

        class Shape {
            constructor(type, x, y, options = {}) {
                this.id = Date.now() + Math.random();
                this.type = type; 
                this.x = x;
                this.y = y;
                this.rotation = options.rotation || 0; 
                this.color = options.color || '#3b82f6';
                this.alpha = options.alpha !== undefined ? options.alpha : 0.7;
                this.r = options.r || 50; 
                this.w = options.w || 100; 
                this.h = options.h || 100; 
                this.w_top = options.w_top || 80; 
                this.angle = options.angle || 90; 
                this.apexOffset = options.apexOffset || 0; 
                
                this.isLocked = false; 
                this.isFixed = false;
                this.strokeWidth = options.strokeWidth || 2;
            }
            
            clone() {
                const copy = new Shape(this.type, this.x, this.y, {
                    rotation: this.rotation, color: this.color, alpha: this.alpha,
                    r: this.r, w: this.w, h: this.h, w_top: this.w_top,
                    angle: this.angle, apexOffset: this.apexOffset,
                    strokeWidth: this.strokeWidth
                });
                copy.isLocked = this.isLocked;
                copy.isFixed = this.isFixed;
                return copy;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                const baseColor = this.color;
                const alphaValue = this.alpha;
                const fillColor = `rgba(${parseInt(baseColor.slice(1, 3), 16)}, ${parseInt(baseColor.slice(3, 5), 16)}, ${parseInt(baseColor.slice(5, 7), 16)}, ${alphaValue})`;
                
                ctx.fillStyle = fillColor;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = this.strokeWidth / scale;

                ctx.beginPath();
                this.createPath(ctx);
                ctx.fill();
                ctx.stroke(); 
                ctx.restore();

                if (selection.length === 1 && selection[0] === this) {
                    this.drawControls();
                } else if (selection.includes(this)) {
                    this.drawSelectionHighlight();
                }
            }

            createPath(ctx) {
                switch (this.type) {
                    case 'Square':
                    case 'Rectangle':
                        ctx.rect(-this.w / 2, -this.h / 2, this.w, this.h); break;
                    case 'Circle':
                        ctx.arc(0, 0, this.r, 0, Math.PI * 2); break;
                    case 'Sector':
                        ctx.moveTo(0, 0); ctx.arc(0, 0, this.r, 0, (this.angle * Math.PI) / 180); ctx.closePath(); break;
                    case 'Triangle':
                        ctx.moveTo(-this.w / 2, this.h / 2); ctx.lineTo(this.w / 2, this.h / 2); ctx.lineTo(this.apexOffset, -this.h / 2); ctx.closePath(); break;
                    case 'Parallelogram':
                        ctx.moveTo(-this.w / 2, this.h / 2); ctx.lineTo(this.w / 2, this.h / 2); ctx.lineTo(this.w / 2 + this.apexOffset, -this.h / 2); ctx.lineTo(-this.w / 2 + this.apexOffset, -this.h / 2); ctx.closePath(); break;
                    case 'Trapezoid': 
                        ctx.moveTo(-this.w / 2, this.h / 2); ctx.lineTo(this.w / 2, this.h / 2); ctx.lineTo(this.w_top / 2, -this.h / 2); ctx.lineTo(-this.w_top / 2, -this.h / 2); ctx.closePath(); break;
                    case 'Plus':
                        const t = Math.min(this.w, this.h) * 0.25;
                        ctx.rect(-this.w/2, -t/2, this.w, t); ctx.rect(-t/2, -this.h/2, t, this.h); break;
                    case 'Minus':
                        ctx.rect(-this.w/2, -this.h/2, this.w, this.h); break;
                    case 'Times':
                        const t2 = Math.min(this.w, this.h) * 0.25;
                        ctx.rotate(Math.PI/4);
                        const s = Math.min(this.w, this.h); 
                        ctx.rect(-s/2, -t2/2, s, t2); ctx.rect(-t2/2, -s/2, t2, s);
                        ctx.rotate(-Math.PI/4); break;
                    case 'Divide':
                        const t3 = Math.min(this.w, this.h) * 0.15;
                        ctx.rect(-this.w/2, -t3/2, this.w, t3);
                        const dr = t3 * 1.5; const dy = this.h * 0.35;
                        ctx.moveTo(dr, -dy); ctx.arc(0, -dy, dr, 0, Math.PI*2);
                        ctx.moveTo(dr, dy); ctx.arc(0, dy, dr, 0, Math.PI*2); break;
                    case 'Equals':
                        const tEq = Math.min(this.w, this.h) * 0.15;
                        const gap = this.h * 0.25;
                        ctx.rect(-this.w/2, -gap - tEq/2, this.w, tEq);
                        ctx.rect(-this.w/2, gap - tEq/2, this.w, tEq);
                        break;
                }
            }
            
            drawSelectionHighlight() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1/scale;
                let bw = this.w || this.r*2; let bh = this.h || this.r*2;
                ctx.strokeRect(-bw/2 - 2, -bh/2 - 2, bw + 4, bh + 4);
                ctx.restore();
            }
            
            drawControls() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                
                let bounds = (this.type === 'Circle' || this.type === 'Sector') ? { w: this.r * 2, h: this.r * 2 } : { w: this.w, h: this.h };
                
                ctx.strokeStyle = (this.isFixed || this.isLocked) ? '#9ca3af' : 'red'; 
                ctx.lineWidth = 1.5/scale; 
                ctx.setLineDash([4/scale, 4/scale]); 
                
                if (this.type === 'Sector') ctx.strokeRect(0, 0, this.r, this.r);
                else if(this.type !== 'Circle') ctx.strokeRect(-bounds.w/2, -bounds.h/2, bounds.w, bounds.h);
                else { ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.stroke(); }
                
                if (!this.isLocked && !this.isFixed) {
                    ctx.setLineDash([]); 
                    const topY = (this.type === 'Sector') ? -this.r * 0.75 : -bounds.h / 2 - 20 / scale;
                    this.drawControlPoint(0, topY, 'green');
                    const resizeX = (this.type === 'Sector') ? this.r : bounds.w / 2;
                    const resizeY = (this.type === 'Sector') ? 0 : bounds.h / 2;
                    this.drawControlPoint(resizeX, resizeY, 'red'); 
                }
                ctx.restore();
            }

            drawControlPoint(cx, cy, color) {
                const size = 6 / scale;
                ctx.fillStyle = color; ctx.strokeStyle = 'white'; ctx.lineWidth = 1/scale;
                ctx.beginPath(); ctx.arc(cx, cy, size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }

            containsPoint(mx, my) {
                const dx = mx - this.x; const dy = my - this.y;
                const cos = Math.cos(-this.rotation); const sin = Math.sin(-this.rotation);
                const localX = dx * cos - dy * sin; const localY = dy * cos + dx * sin; 
                if (this.type === 'Circle') return Math.sqrt(dx*dx + dy*dy) <= this.r;
                if (this.type === 'Sector') {
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > this.r) return false;
                    let angle = Math.atan2(dy, dx) - this.rotation;
                    if (angle < 0) angle += 2 * Math.PI;
                    if (angle > 2 * Math.PI) angle -= 2 * Math.PI;
                    return angle >= 0 && angle <= (this.angle * Math.PI) / 180;
                }
                return localX >= -this.w/2 && localX <= this.w/2 && localY >= -this.h/2 && localY <= this.h/2;
            }

            checkControls(mx, my) {
                if (this.isLocked || this.isFixed) return null;
                
                const dx = mx - this.x; const dy = my - this.y;
                const cos = Math.cos(-this.rotation); const sin = Math.sin(-this.rotation);
                const localX = dx * cos - dy * sin; const localY = dy * cos + dx * sin; 
                const hitSize = 15 / scale; 
                let bounds = (this.type === 'Circle' || this.type === 'Sector') ? { w: this.r * 2, h: this.r * 2 } : { w: this.w, h: this.h };
                let rotateX = 0, rotateY = (this.type === 'Sector') ? -this.r * 0.75 : -bounds.h / 2 - 20 / scale;
                let resizeX = (this.type === 'Sector') ? this.r : bounds.w / 2;
                let resizeY = (this.type === 'Sector') ? 0 : bounds.h / 2;
                if (Math.abs(localX - resizeX) < hitSize && Math.abs(localY - resizeY) < hitSize) return 'resize';
                if (Math.abs(localX - rotateX) < hitSize && Math.abs(localY - rotateY) < hitSize) return 'rotate';
                return null;
            }
        }

        class Group extends Shape {
            constructor(children) {
                super('Group', 0, 0);
                this.children = children;
                this.isLocked = false;
                this.isFixed = false;
                this.recalculateBounds();
            }
            clone() {
                const clonedChildren = this.children.map(c => c.clone());
                const copy = new Group(clonedChildren);
                copy.x = this.x;
                copy.y = this.y;
                copy.rotation = this.rotation;
                copy.isLocked = this.isLocked;
                copy.isFixed = this.isFixed;
                copy.recalculateBounds();
                return copy;
            }
            recalculateBounds() {
                if (this.children.length === 0) return;
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                this.children.forEach(c => {
                    let w = c.w || c.r*2 || 0; let h = c.h || c.r*2 || 0; 
                    if(c.type === 'TextLabel') { w = c.w; h = c.h; }
                    minX = Math.min(minX, c.x - w/2); maxX = Math.max(maxX, c.x + w/2);
                    minY = Math.min(minY, c.y - h/2); maxY = Math.max(maxY, c.y + h/2);
                });
                this.w = maxX - minX; this.h = maxY - minY;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                this.children.forEach(child => child.draw());
                ctx.restore();
                if (selection.includes(this)) this.drawSelectionHighlight();
            }
            drawSelectionHighlight() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.strokeStyle = (this.isFixed || this.isLocked) ? '#9ca3af' : '#8b5cf6'; 
                ctx.lineWidth = 2/scale; ctx.setLineDash([5/scale, 5/scale]);
                ctx.strokeRect(-this.w/2 - 5/scale, -this.h/2 - 5/scale, this.w + 10/scale, this.h + 10/scale);
                ctx.setLineDash([]); ctx.restore();
            }
            containsPoint(mx, my) {
                const dx = mx - this.x; const dy = my - this.y;
                const cos = Math.cos(-this.rotation); const sin = Math.sin(-this.rotation);
                const localX = dx * cos - dy * sin; const localY = dy * cos + dx * sin;
                for (let child of this.children) { if (child.containsPoint(localX, localY)) return true; }
                return false;
            }
            checkControls(mx, my) { return null; } 
        }

        class TextLabel {
            constructor(text, x, y, options = {}) {
                this.id = Date.now() + Math.random();
                this.type = 'TextLabel';
                this.text = text; this.x = x; this.y = y;
                this.color = options.color || '#000000'; this.fontSize = options.fontSize || 24;
                this.w = 0; this.h = this.fontSize; this.rotation = 0;
                this.isLocked = false;
                this.isFixed = false;
            }
            clone() {
                const copy = new TextLabel(this.text, this.x, this.y, {color: this.color, fontSize: this.fontSize});
                copy.isLocked = this.isLocked;
                copy.isFixed = this.isFixed;
                return copy;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                const currentFontSize = this.fontSize / scale;
                ctx.font = `bold ${currentFontSize}px Inter, sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.text, 0, 0);
                const metrics = ctx.measureText(this.text);
                this.w = metrics.width * scale; this.h = currentFontSize * 1.2 * scale;
                if (selection.includes(this)) {
                     ctx.strokeStyle = (this.isFixed || this.isLocked) ? '#9ca3af' : '#3b82f6';
                     ctx.lineWidth = 1.5/scale; ctx.setLineDash([4/scale, 4/scale]);
                     ctx.strokeRect(-this.w/2 - 5/scale, -this.h/2 - 5/scale, this.w + 10/scale, this.h + 10/scale);
                }
                ctx.restore();
            }
            containsPoint(mx, my) {
                const localX = mx - this.x; const localY = my - this.y;
                return localX >= -(this.w/2) && localX <= (this.w/2) && localY >= -(this.h/2) && localY <= (this.h/2);
            }
            checkControls() { return null; } 
        }

        class Annotation {
             constructor(points, color, width, x, y) {
                this.type = 'Annotation'; this.points = points; this.color = color; this.width = width;
                this.x = x; this.y = y; this.rotation = 0;
                this.isLocked = false;
                this.isFixed = false;
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                points.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
                this.w = maxX - minX; this.h = maxY - minY;
            }
            clone() {
                const pts = this.points.map(p => ({x: p.x, y: p.y}));
                const copy = new Annotation(pts, this.color, this.width, this.x, this.y);
                copy.isLocked = this.isLocked;
                copy.isFixed = this.isFixed;
                return copy;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color; ctx.lineWidth = this.width / scale;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                if (selection.includes(this)) {
                    ctx.save(); ctx.strokeStyle = (this.isFixed || this.isLocked) ? '#9ca3af' : '#ef4444'; ctx.lineWidth = 1.5/scale; ctx.setLineDash([4/scale, 4/scale]);
                    const pad = (this.width/2 + 5)/scale;
                    ctx.strokeRect(-this.w/2 - pad, -this.h/2 - pad, this.w + pad*2, this.h + pad*2);
                    ctx.restore(); 
                }
                ctx.beginPath();
                if (this.points.length > 0) {
                    ctx.moveTo(this.points[0].x, this.points[0].y);
                    for (let i = 1; i < this.points.length; i++) { ctx.lineTo(this.points[i].x, this.points[i].y); }
                }
                ctx.stroke(); ctx.restore();
            }
            containsPoint(mx, my, tolerance = 0) {
                const localMx = mx - this.x; const localMy = my - this.y;
                tolerance = (this.width/2 + 10 + tolerance) / scale; 
                if (localMx < -this.w/2 - tolerance || localMx > this.w/2 + tolerance || localMy < -this.h/2 - tolerance || localMy > this.h/2 + tolerance) return false;
                for (let i = 0; i < this.points.length - 1; i++) {
                    const p1 = this.points[i]; const p2 = this.points[i + 1];
                    const minX = Math.min(p1.x, p2.x)-tolerance; const maxX = Math.max(p1.x, p2.x)+tolerance;
                    const minY = Math.min(p1.y, p2.y)-tolerance; const maxY = Math.max(p1.y, p2.y)+tolerance;
                    if (localMx >= minX && localMx <= maxX && localMy >= minY && localMy <= maxY) return true;
                }
                return false;
            }
            checkControls() { return null; }
        }

        // --- History Functions ---
        function saveState() {
            if (historyStep < history.length - 1) {
                history.length = historyStep + 1;
            }
            const snapshot = shapes.map(s => s.clone());
            history.push(snapshot);
            historyStep++;
            
            if (history.length > 50) {
                history.shift();
                historyStep--;
            }
            updateUndoRedoUI();
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                restoreState(history[historyStep]);
            }
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                restoreState(history[historyStep]);
            }
        }
        
        function restoreState(state) {
             shapes = state.map(s => s.clone()); 
             selection = []; 
             updatePropertiesPanel();
             updateUndoRedoUI();
        }
        
        function updateUndoRedoUI() {
            const undoBtn = document.getElementById('btn-undo');
            const redoBtn = document.getElementById('btn-redo');
            if(undoBtn) undoBtn.disabled = (historyStep <= 0);
            if(redoBtn) redoBtn.disabled = (historyStep >= history.length - 1);
        }

        function performBooleanOp(op) {
            if (selection.length < 2) return;
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            selection.forEach(s => {
                let w = s.w || s.r*2; let h = s.h || s.r*2;
                minX = Math.min(minX, s.x - w/2);
                maxX = Math.max(maxX, s.x + w/2);
                minY = Math.min(minY, s.y - h/2);
                maxY = Math.max(maxY, s.y + h/2);
            });
            minX -= 10; minY -= 10; maxX += 10; maxY += 10;
            const width = maxX - minX;
            const height = maxY - minY;
            const buffer = document.createElement('canvas');
            buffer.width = width * scale;
            buffer.height = height * scale;
            const bCtx = buffer.getContext('2d');
            const drawLocal = (ctx, s) => {
                ctx.save();
                ctx.scale(scale, scale);
                ctx.translate(-minX, -minY); 
                ctx.translate(s.x, s.y);
                ctx.rotate(s.rotation);
                ctx.beginPath();
                if(s.createPath) s.createPath(ctx);
                else ctx.rect(-s.w/2, -s.h/2, s.w, s.h);
                ctx.fillStyle = '#000'; 
                ctx.fill();
                ctx.restore();
            }
            drawLocal(bCtx, selection[0]);
            for (let i = 1; i < selection.length; i++) {
                const shape = selection[i];
                switch (op) {
                    case 'union': bCtx.globalCompositeOperation = 'source-over'; break;
                    case 'difference': bCtx.globalCompositeOperation = 'destination-out'; break;
                    case 'intersection': bCtx.globalCompositeOperation = 'source-in'; break;
                    case 'xor': bCtx.globalCompositeOperation = 'xor'; break;
                }
                drawLocal(bCtx, shape);
            }
            const resultImg = bCtx.getImageData(0, 0, buffer.width, buffer.height);
            const newShape = new BitmapShape(resultImg, minX, minY, width, height, selection[0].color);
            newShape.alpha = 0.8; 
            selection.forEach(s => {
                const idx = shapes.indexOf(s);
                if(idx > -1) shapes.splice(idx, 1);
            });
            shapes.push(newShape);
            selection = [newShape];
            updatePropertiesPanel();
            saveState(); 
        }

        function toggleLock() {
            selection.forEach(s => {
                s.isLocked = !s.isLocked;
                if(s.isLocked && s.isFixed) s.isFixed = false;
            });
            updatePropertiesPanel();
            saveState();
        }

        function toggleFix() {
            selection.forEach(s => {
                s.isFixed = !s.isFixed;
                if(s.isFixed && s.isLocked) s.isLocked = false;
            });
            updatePropertiesPanel();
            saveState();
        }

        function updatePropertiesPanel() {
            const ids = ['no-selection-message', 'pen-settings-panel', 'text-tool-panel', 
                         'shape-properties', 'text-properties', 'multi-selection-panel', 'group-properties'];
            ids.forEach(id => document.getElementById(id).classList.add('hidden'));

            // Reset sub-panels in pen-settings
            document.getElementById('drawing-tools-group').classList.remove('hidden');
            document.getElementById('eraser-settings-panel').classList.add('hidden');
            
            // Eraser Mode
            if (isErasing) {
                document.getElementById('pen-settings-panel').classList.remove('hidden');
                document.getElementById('drawing-tools-group').classList.add('hidden');
                document.getElementById('eraser-settings-panel').classList.remove('hidden');
                return;
            }
            
            // Drawing Mode
            if (interactionMode === 'drawing') {
                document.getElementById('pen-settings-panel').classList.remove('hidden');
                return;
            }
            
            if (interactionMode === 'text') { document.getElementById('text-tool-panel').classList.remove('hidden'); return; }

            if (selection.length === 0) {
                document.getElementById('no-selection-message').classList.remove('hidden');
            } else if (selection.length > 1) {
                const p = document.getElementById('multi-selection-panel');
                p.classList.remove('hidden');
                document.getElementById('selection-count').textContent = selection.length;
                
                const allLocked = selection.every(s => s.isLocked);
                const allFixed = selection.every(s => s.isFixed);
                const btnLock = document.getElementById('batch-lock-btn');
                const btnFix = document.getElementById('batch-fix-btn');
                btnLock.classList.toggle('active', allLocked);
                btnFix.classList.toggle('active', allFixed);
                
            } else {
                const obj = selection[0];
                
                const setupStateBtns = (prefix) => {
                    const btnLock = document.getElementById(prefix + '-lock-btn');
                    const btnFix = document.getElementById(prefix + '-fix-btn');
                    if(btnLock) {
                        btnLock.classList.toggle('active', obj.isLocked);
                        btnLock.onclick = toggleLock;
                    }
                    if(btnFix) {
                        btnFix.classList.toggle('active', obj.isFixed);
                        btnFix.onclick = toggleFix;
                    }
                };

                if (obj.type === 'Group') {
                    document.getElementById('group-properties').classList.remove('hidden');
                    setupStateBtns('group');
                } else if (obj.type === 'TextLabel') {
                    document.getElementById('text-properties').classList.remove('hidden');
                    document.getElementById('text-content-edit').value = obj.text;
                    document.getElementById('text-color').value = obj.color;
                    document.getElementById('text-font-size').value = obj.fontSize;
                    setupStateBtns('text');
                } else if (obj.type !== 'Annotation') {
                    const p = document.getElementById('shape-properties');
                    p.classList.remove('hidden');
                    setupStateBtns('shape');
                    
                    document.getElementById('shape-color').value = obj.color;
                    document.getElementById('shape-alpha').value = obj.alpha;
                    document.getElementById('alpha-display').textContent = `${Math.round(obj.alpha * 100)}%`;
                    
                    const strokeInput = document.getElementById('shape-stroke-width');
                    const strokeDisplay = document.getElementById('stroke-width-display');
                    if(obj.strokeWidth !== undefined) {
                        strokeInput.value = obj.strokeWidth;
                        strokeDisplay.textContent = obj.strokeWidth;
                        strokeInput.parentElement.classList.remove('hidden');
                    } else {
                        strokeInput.parentElement.classList.add('hidden');
                    }

                    const dim1 = document.getElementById('shape-dim1');
                    const dim2Container = document.getElementById('dim-input-2-container');
                    const dimTopContainer = document.getElementById('dim-input-top-container');
                    const angleGroup = document.getElementById('angle-input-group');
                    const offsetGroup = document.getElementById('apex-offset-group');
                    
                    dim2Container.classList.add('hidden');
                    dimTopContainer.classList.add('hidden');
                    angleGroup.classList.add('hidden');
                    offsetGroup.classList.add('hidden');

                    const l1 = document.getElementById('label-dim1');
                    const l2 = document.getElementById('label-dim2');

                    if(['Circle','Sector'].includes(obj.type)) {
                        l1.textContent = 'R'; dim1.value = Math.round(obj.r);
                        if(obj.type === 'Sector') {
                            document.getElementById('sector-angle').value = Math.round(obj.angle);
                            angleGroup.classList.remove('hidden');
                        }
                    } else {
                        l1.textContent = 'W'; dim1.value = Math.round(obj.w);
                        l2.textContent = 'H'; 
                        document.getElementById('shape-dim2').value = Math.round(obj.h);
                        dim2Container.classList.remove('hidden');
                        
                        if(obj.type === 'Trapezoid') {
                             document.getElementById('shape-dim-top').value = Math.round(obj.w_top);
                             dimTopContainer.classList.remove('hidden');
                        }
                        if(['Triangle', 'Parallelogram'].includes(obj.type)) {
                             offsetGroup.classList.remove('hidden');
                             document.getElementById('shape-apex-offset-value').value = Math.round(obj.apexOffset);
                             document.getElementById('offset-display').textContent = Math.round(obj.apexOffset);
                        }
                    }
                }
            }
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left - translateX) / scale,
                y: (clientY - rect.top - translateY) / scale,
                cx: clientX,
                cy: clientY
            };
        }

        function handleMouseDown(e) {
            if (e.touches && e.touches.length > 1) return;
            if (e.type === 'touchstart') e.preventDefault();
            
            const pos = getEventPos(e);
            const isShift = e.shiftKey;

            if (isErasing) {
                const eraserSize = eraserWidth / scale;
                let stateChanged = false;
                for (let i = shapes.length - 1; i >= 0; i--) {
                    const s = shapes[i];
                    
                    if (s.isLocked || s.isFixed) continue;

                    if (s.type === 'Annotation') {
                        const dx = pos.x - s.x;
                        const dy = pos.y - s.y;
                        if (dx < -s.w/2 - eraserSize || dx > s.w/2 + eraserSize || 
                            dy < -s.h/2 - eraserSize || dy > s.h/2 + eraserSize) continue;

                        let newSegments = [];
                        let currentSegment = [];
                        let modified = false;
                        for (let j = 0; j < s.points.length; j++) {
                            const p = s.points[j];
                            const px = s.x + p.x;
                            const py = s.y + p.y;
                            const distSq = (px - pos.x)**2 + (py - pos.y)**2;
                            if (distSq < eraserSize**2) {
                                modified = true;
                                if (currentSegment.length > 0) {
                                    newSegments.push(currentSegment);
                                    currentSegment = [];
                                }
                            } else {
                                currentSegment.push(p);
                            }
                        }
                        if (currentSegment.length > 0) newSegments.push(currentSegment);
                        if (modified) {
                            shapes.splice(i, 1);
                            for (let seg of newSegments) {
                                if (seg.length < 2) continue; 
                                const absPoints = seg.map(p => ({x: s.x + p.x, y: s.y + p.y}));
                                createAnnotationShape(absPoints, s.color, s.width);
                            }
                            stateChanged = true;
                        }
                    } else if (s.type === 'FloodFill') {
                         const cos = Math.cos(-s.rotation);
                         const sin = Math.sin(-s.rotation);
                         const dx = pos.x - s.x;
                         const dy = pos.y - s.y;
                         const lx = dx * cos - dy * sin;
                         const ly = dy * cos + dx * sin;
                         if (lx >= -s.w/2 - eraserSize && lx <= s.w/2 + eraserSize &&
                             ly >= -s.h/2 - eraserSize && ly <= s.h/2 + eraserSize) {
                             const ctx1 = s.fillCanvas.getContext('2d');
                             const ctx2 = s.outlineCanvas.getContext('2d');
                             const cx = lx + s.w/2;
                             const cy = ly + s.h/2;
                             ctx1.globalCompositeOperation = 'destination-out';
                             ctx1.beginPath(); ctx1.arc(cx, cy, eraserSize, 0, Math.PI*2); ctx1.fill();
                             ctx2.globalCompositeOperation = 'destination-out';
                             ctx2.beginPath(); ctx2.arc(cx, cy, eraserSize, 0, Math.PI*2); ctx2.fill();
                             ctx1.globalCompositeOperation = 'source-over';
                             ctx2.globalCompositeOperation = 'source-over';
                             stateChanged = true; 
                         }
                    } else {
                        // Standard Shapes: Delete whole object
                         if(s.containsPoint(pos.x, pos.y)) {
                             shapes.splice(i, 1);
                             stateChanged = true;
                             saveState();
                             return; 
                         }
                    }
                }
                if (stateChanged) saveState(); 
                return;
            }

            if (selection.length === 1) {
                const ctl = selection[0].checkControls(pos.x, pos.y);
                if (ctl) {
                    if (ctl === 'resize') isResizing = true;
                    if (ctl === 'rotate') isRotating = true;
                    return;
                }
            }
            
            if (interactionMode === 'drawing') {
                 isDrawing = true;
                 if(drawingMode === 'freehand') currentAnnotation = { points: [pos], color: penColor, width: penWidth };
                 else { straightLineStart = pos; straightLineEnd = pos; }
                 return;
            }

            let hitObj = null;
            for (let i = shapes.length - 1; i >= 0; i--) {
                if (shapes[i].containsPoint(pos.x, pos.y)) {
                    hitObj = shapes[i];
                    break;
                }
            }
            
            if (hitObj) {
                if (isShift) {
                    const idx = selection.indexOf(hitObj);
                    if (idx > -1) selection.splice(idx, 1);
                    else selection.push(hitObj);
                } else {
                    if (!selection.includes(hitObj)) selection = [hitObj];
                }
                
                isDragging = true;
                dragStartPositions = selection.map(s => ({ obj: s, startX: s.x, startY: s.y }));
                dragOffsetX = pos.x;
                dragOffsetY = pos.y;
                updatePropertiesPanel();
                return;
            }
            
            if (!isShift) {
                selection = [];
                updatePropertiesPanel();
            }
            
            if (interactionMode === 'geometry') {
                isSelecting = true;
                selectionBox.startX = pos.x;
                selectionBox.startY = pos.y;
                selectionBox.currentX = pos.x;
                selectionBox.currentY = pos.y;
            } else {
                isPanning = true;
                dragOffsetX = pos.cx - translateX;
                dragOffsetY = pos.cy - translateY;
            }
        }
        
        function handleMouseMove(e) {
            if (e.type === 'touchmove') e.preventDefault();
            const pos = getEventPos(e);
            lastMousePos = pos; // Update global for cursor drawing

            if (isErasing && (e.buttons === 1 || e.type === 'touchmove')) {
                const eraserSize = eraserWidth / scale;
                let stateChanged = false;
                for (let i = shapes.length - 1; i >= 0; i--) {
                    const s = shapes[i];
                    
                    if (s.isLocked || s.isFixed) continue;

                    if (s.type === 'Annotation') {
                        const dx = pos.x - s.x;
                        const dy = pos.y - s.y;
                        if (dx < -s.w/2 - eraserSize || dx > s.w/2 + eraserSize || 
                            dy < -s.h/2 - eraserSize || dy > s.h/2 + eraserSize) continue;

                        let newSegments = [];
                        let currentSegment = [];
                        let modified = false;
                        for (let j = 0; j < s.points.length; j++) {
                            const p = s.points[j];
                            const px = s.x + p.x;
                            const py = s.y + p.y;
                            const distSq = (px - pos.x)**2 + (py - pos.y)**2;
                            if (distSq < eraserSize**2) {
                                modified = true;
                                if (currentSegment.length > 0) {
                                    newSegments.push(currentSegment);
                                    currentSegment = [];
                                }
                            } else {
                                currentSegment.push(p);
                            }
                        }
                        if (currentSegment.length > 0) newSegments.push(currentSegment);
                        if (modified) {
                            shapes.splice(i, 1);
                            for (let seg of newSegments) {
                                if (seg.length < 2) continue; 
                                const absPoints = seg.map(p => ({x: s.x + p.x, y: s.y + p.y}));
                                createAnnotationShape(absPoints, s.color, s.width);
                            }
                            stateChanged = true;
                        }
                    } else if (s.type === 'FloodFill') {
                         const cos = Math.cos(-s.rotation);
                         const sin = Math.sin(-s.rotation);
                         const dx = pos.x - s.x;
                         const dy = pos.y - s.y;
                         const lx = dx * cos - dy * sin;
                         const ly = dy * cos + dx * sin;
                         if (lx >= -s.w/2 - eraserSize && lx <= s.w/2 + eraserSize &&
                             ly >= -s.h/2 - eraserSize && ly <= s.h/2 + eraserSize) {
                             const ctx1 = s.fillCanvas.getContext('2d');
                             const ctx2 = s.outlineCanvas.getContext('2d');
                             const cx = lx + s.w/2;
                             const cy = ly + s.h/2;
                             ctx1.globalCompositeOperation = 'destination-out';
                             ctx1.beginPath(); ctx1.arc(cx, cy, eraserSize, 0, Math.PI*2); ctx1.fill();
                             ctx2.globalCompositeOperation = 'destination-out';
                             ctx2.beginPath(); ctx2.arc(cx, cy, eraserSize, 0, Math.PI*2); ctx2.fill();
                             ctx1.globalCompositeOperation = 'source-over';
                             ctx2.globalCompositeOperation = 'source-over';
                             stateChanged = true; 
                         }
                    }
                }
                if (stateChanged) saveState(); // Save if modified
                return;
            }

            if (selection.length === 1 && !isDrawing && !isDragging) {
                 const ctl = selection[0].checkControls(pos.x, pos.y);
                 if (ctl === 'resize') canvas.style.cursor = 'nwse-resize';
                 else if (ctl === 'rotate') canvas.style.cursor = 'pointer';
                 else canvas.style.cursor = 'default';
            }
            
            if (isErasing) {
                canvas.style.cursor = 'none'; // We draw custom cursor
            }

            if (isDrawing) {
                if (drawingMode === 'freehand') currentAnnotation.points.push(pos);
                else straightLineEnd = pos;
                return;
            }
            
            if (isSelecting) {
                selectionBox.currentX = pos.x;
                selectionBox.currentY = pos.y;
                return;
            }

            if (isResizing && selection.length === 1) {
                const s = selection[0];
                const dx = pos.x - s.x;
                const dy = pos.y - s.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(['Circle','Sector'].includes(s.type)) s.r = dist;
                else {
                    const scaleRatio = dist / Math.sqrt((s.w/2)**2 + (s.h/2)**2);
                    s.w *= scaleRatio || 1;
                    s.h *= scaleRatio || 1;
                    if(s.w_top) s.w_top *= scaleRatio || 1;
                }
                updatePropertiesPanel();
            } else if (isRotating && selection.length === 1) {
                const s = selection[0];
                const angle = Math.atan2(pos.y - s.y, pos.x - s.x);
                s.rotation = angle + Math.PI/2;
            } else if (isDragging) {
                const dx = pos.x - dragOffsetX;
                const dy = pos.y - dragOffsetY;
                dragStartPositions.forEach(item => {
                    if (!item.obj.isFixed) {
                        item.obj.x = item.startX + dx;
                        item.obj.y = item.startY + dy;
                    }
                });
            } else if (isPanning) {
                translateX = pos.cx - dragOffsetX;
                translateY = pos.cy - dragOffsetY;
            }
        }
        
        function handleMouseUp(e) {
            if (isDrawing) {
                 if(drawingMode === 'freehand' && currentAnnotation.points.length > 1) {
                     createAnnotationShape(currentAnnotation.points, penColor, penWidth);
                     saveState();
                 } else if (drawingMode === 'straightLine') {
                     createAnnotationShape([straightLineStart, straightLineEnd], penColor, penWidth);
                     saveState();
                 }
            }
            
            if (isSelecting) {
                const sx = Math.min(selectionBox.startX, selectionBox.currentX);
                const ex = Math.max(selectionBox.startX, selectionBox.currentX);
                const sy = Math.min(selectionBox.startY, selectionBox.currentY);
                const ey = Math.max(selectionBox.startY, selectionBox.currentY);
                
                shapes.forEach(s => {
                    if (s.x >= sx && s.x <= ex && s.y >= sy && s.y <= ey) {
                        if (!selection.includes(s)) selection.push(s);
                    }
                });
                updatePropertiesPanel();
            }
            
            if (isErasing) {
                saveState();
            }

            if (isDragging || isResizing || isRotating) {
                saveState();
            }

            isDragging = false;
            isResizing = false;
            isRotating = false;
            isPanning = false;
            isDrawing = false;
            isSelecting = false;
            currentAnnotation = null;
            if (!isErasing) canvas.style.cursor = 'default';
        }
        
        function createAnnotationShape(points, color, width) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            points.forEach(p => {
                minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
            });
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;
            const relPoints = points.map(p => ({ x: p.x - cx, y: p.y - cy }));
            const ann = new Annotation(relPoints, color, width, cx, cy);
            shapes.push(ann);
        }

        function handleWheel(e) {
             e.preventDefault();
             const scaleAmount = 1.1;
             const pos = getEventPos(e);
             const newScale = e.deltaY < 0 ? scale * scaleAmount : scale / scaleAmount;
             if(newScale < 0.1 || newScale > 5) return;
             
             const mouseWorldX = (pos.cx - canvas.getBoundingClientRect().left - translateX) / scale;
             const mouseWorldY = (pos.cy - canvas.getBoundingClientRect().top - translateY) / scale;
             translateX = (pos.cx - canvas.getBoundingClientRect().left) - mouseWorldX * newScale;
             translateY = (pos.cy - canvas.getBoundingClientRect().top) - mouseWorldY * newScale;
             scale = newScale;
        }

        function createGroup() {
            if (selection.length < 2) return;
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            selection.forEach(obj => {
                let w = obj.w || obj.r*2 || 0; let h = obj.h || obj.r*2 || 0;
                if(obj.type === 'TextLabel') { w = obj.w/scale; h = obj.h/scale; }
                minX = Math.min(minX, obj.x - w/2); maxX = Math.max(maxX, obj.x + w/2);
                minY = Math.min(minY, obj.y - h/2); maxY = Math.max(maxY, obj.y + h/2);
            });
            const cx = (minX + maxX) / 2; const cy = (minY + maxY) / 2;
            const group = new Group([]); group.x = cx; group.y = cy;
            selection.forEach(obj => {
                obj.x -= cx; obj.y -= cy; group.children.push(obj);
                const idx = shapes.indexOf(obj); if(idx > -1) shapes.splice(idx, 1);
            });
            group.recalculateBounds(); shapes.push(group); selection = [group]; updatePropertiesPanel();
            saveState();
        }
        
        function ungroupObjects() {
            if (selection.length !== 1 || selection[0].type !== 'Group') return;
            const group = selection[0];
            group.children.forEach(child => { child.x += group.x; child.y += group.y; shapes.push(child); });
            const idx = shapes.indexOf(group); if(idx > -1) shapes.splice(idx, 1);
            selection = [...group.children]; updatePropertiesPanel();
            saveState();
        }
        
        function deleteSelection() {
             selection.forEach(obj => { const idx = shapes.indexOf(obj); if(idx > -1) shapes.splice(idx, 1); });
             selection = []; updatePropertiesPanel();
             saveState();
        }

        function handleDuplicate() {
            if (selection.length !== 1) return;
            const s = selection[0];
            let copy;
            if (s.type === 'TextLabel') copy = s.clone();
            else if (s.type !== 'Group' && s.type !== 'FloodFill') {
                copy = s.clone();
            } else if(s.clone) {
                copy = s.clone();
            }
            if(copy) { shapes.push(copy); selection = [copy]; updatePropertiesPanel(); saveState(); }
        }

        function moveLayer(action) {
            if (selection.length !== 1) return;
            const obj = selection[0]; const idx = shapes.indexOf(obj); if (idx === -1) return;
            if (action === 'back') { shapes.splice(idx, 1); shapes.unshift(obj); } 
            else if (action === 'front') { shapes.splice(idx, 1); shapes.push(obj); } 
            else if (action === 'down' && idx > 0) { [shapes[idx], shapes[idx - 1]] = [shapes[idx - 1], shapes[idx]]; } 
            else if (action === 'up' && idx < shapes.length - 1) { [shapes[idx], shapes[idx + 1]] = [shapes[idx + 1], shapes[idx]]; }
            saveState();
        }

        function setupEventListeners() {
            document.getElementById('tool-select').onclick = () => { interactionMode='geometry'; updateToolbarUI(); };
            document.getElementById('tool-pen').onclick = () => { interactionMode='drawing'; updateToolbarUI(); };
            document.getElementById('tool-text').onclick = () => { interactionMode='text'; updateToolbarUI(); };
            document.getElementById('tool-eraser').onclick = () => { isErasing=!isErasing; interactionMode='geometry'; updateToolbarUI(); };
            
            document.querySelectorAll('.shape-btn').forEach(btn => btn.onclick = handleAddShape);
            
            document.getElementById('reset-view-btn').onclick = () => { translateX=canvas.width/2; translateY=canvas.height/2; scale=1; };
            document.getElementById('clear-canvas-btn').onclick = () => { if(confirm("確定清空?")) { shapes=[]; selection=[]; saveState(); updatePropertiesPanel(); }};

            document.getElementById('mode-freehand-btn').onclick = () => { drawingMode='freehand'; updateToolbarUI(); };
            document.getElementById('mode-straight-btn').onclick = () => { drawingMode='straightLine'; updateToolbarUI(); };
            document.getElementById('pen-color').onchange = (e) => { penColor = e.target.value; }; 
            document.getElementById('pen-width').onchange = (e) => { penWidth = parseInt(e.target.value); document.getElementById('width-display').textContent=penWidth+'px'; };
            document.getElementById('clear-annotations-btn').onclick = () => { 
                shapes = shapes.filter(s => s.type !== 'Annotation'); 
                selection = [];
                updatePropertiesPanel();
                saveState();
            };
            
            document.getElementById('eraser-width').oninput = (e) => { 
                eraserWidth = parseInt(e.target.value);
                document.getElementById('eraser-width-display').textContent = eraserWidth + 'px';
            };

            document.getElementById('add-text-btn').onclick = handleAddText;
            
            const shapeInputs = ['shape-color', 'shape-alpha', 'shape-dim1', 'shape-dim2', 'shape-dim-top', 
                               'sector-angle', 'shape-apex-offset-slider', 'shape-stroke-width', 'text-content-edit', 'text-color', 'text-font-size'];
            
            shapeInputs.forEach(id => {
                const el = document.getElementById(id);
                if(!el) return;
                el.oninput = (e) => {
                    if(selection.length !== 1) return;
                    const s = selection[0];
                    const val = e.target.value;
                    if(id==='shape-color' || id==='text-color') s.color = val;
                    if(id==='shape-alpha') { s.alpha = parseFloat(val); document.getElementById('alpha-display').textContent = Math.round(s.alpha*100)+'%'; }
                    if(id==='shape-dim1') { if(['Circle','Sector'].includes(s.type)) s.r=parseFloat(val); else s.w=parseFloat(val); }
                    if(id==='shape-dim2') s.h = parseFloat(val);
                    if(id==='shape-dim-top') s.w_top = parseFloat(val);
                    if(id==='sector-angle') s.angle = parseFloat(val);
                    if(id==='shape-stroke-width') { s.strokeWidth = parseInt(val); document.getElementById('stroke-width-display').textContent = val; }
                    if(id==='shape-apex-offset-slider') {
                        const limit = s.w/2; s.apexOffset = (parseFloat(val)/50) * limit;
                        if(s.type.includes('Triangle')||s.type==='Parallelogram') document.getElementById('offset-display').textContent = Math.round(s.apexOffset)+'px';
                    }
                    if(id==='text-content-edit') s.text = val;
                    if(id==='text-font-size') { s.fontSize = parseInt(val); document.getElementById('font-size-display').textContent=val; }
                };
                el.onchange = () => saveState();
            });
            
            document.getElementById('group-btn').onclick = createGroup;
            document.getElementById('ungroup-btn').onclick = ungroupObjects;
            document.getElementById('delete-selection-btn').onclick = deleteSelection;
            document.getElementById('delete-group-btn').onclick = deleteSelection;
            
            document.getElementById('duplicate-shape-btn').onclick = handleDuplicate;
            document.getElementById('delete-shape-btn').onclick = deleteSelection;
            document.getElementById('send-to-back-btn').onclick = () => moveLayer('back');
            document.getElementById('bring-to-front-btn').onclick = () => moveLayer('front');
            document.getElementById('move-up-btn').onclick = () => moveLayer('up');
            document.getElementById('move-down-btn').onclick = () => moveLayer('down');
            
            document.getElementById('duplicate-text-btn').onclick = handleDuplicate;
            document.getElementById('delete-text-btn').onclick = deleteSelection;

            document.getElementById('batch-lock-btn').onclick = toggleLock;
            document.getElementById('batch-fix-btn').onclick = toggleFix;
            
            // Single item lock/fix
            document.getElementById('shape-lock-btn').onclick = toggleLock;
            document.getElementById('shape-fix-btn').onclick = toggleFix;
            document.getElementById('group-lock-btn').onclick = toggleLock;
            document.getElementById('group-fix-btn').onclick = toggleFix;
            document.getElementById('text-lock-btn').onclick = toggleLock;
            document.getElementById('text-fix-btn').onclick = toggleFix;

            document.getElementById('btn-union').onclick = () => performBooleanOp('union');
            document.getElementById('btn-difference').onclick = () => performBooleanOp('difference');
            document.getElementById('btn-intersection').onclick = () => performBooleanOp('intersection');
            document.getElementById('btn-xor').onclick = () => performBooleanOp('xor');

            // Undo/Redo
            document.getElementById('btn-undo').onclick = undo;
            document.getElementById('btn-redo').onclick = redo;

            window.addEventListener('keydown', (e) => {
                if((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
                if((e.ctrlKey || e.metaKey) && e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
            });

            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('touchstart', handleMouseDown, {passive: false});
            canvas.addEventListener('touchmove', handleMouseMove, {passive: false});
            window.addEventListener('touchend', handleMouseUp);
            canvas.addEventListener('wheel', handleWheel, {passive: false});
        }
        
        function handleAddShape(event) {
            interactionMode = 'geometry'; isErasing = false;
            const btn = event.currentTarget; const type = btn.dataset.shape; let opts = { color: '#3b82f6' };
            if (type === 'Square') opts.color = '#4ade80'; 
            if (type === 'Rectangle') opts.color = '#60a5fa';
            if (type === 'Triangle') opts.color = '#f472b6'; 
            if (type === 'Circle') opts.color = '#a78bfa';
            if (type === 'Parallelogram') opts.color = '#2dd4bf'; 
            if (type === 'Trapezoid') opts.color = '#fbbf24';
            if (type === 'Sector') opts.color = '#f87171'; 
            if (['Plus', 'Minus', 'Times', 'Divide', 'Equals'].includes(type)) opts.color = '#9ca3af'; 

            if (type === 'Square') { opts.w = opts.h = parseFloat(btn.dataset.s) || 120; }
            else if (type === 'Rectangle') { opts.w = parseFloat(btn.dataset.w); opts.h = parseFloat(btn.dataset.h); }
            else if (type === 'Triangle' || type === 'Parallelogram') { opts.w = parseFloat(btn.dataset.w); opts.h = parseFloat(btn.dataset.h); opts.apexOffset = parseFloat(btn.dataset.offset)||0; }
            else if (type === 'Trapezoid') { opts.w = parseFloat(btn.dataset.w); opts.h = parseFloat(btn.dataset.h); opts.w_top = parseFloat(btn.dataset.w_top); }
            else if (type === 'Circle' || type === 'Sector') { opts.r = parseFloat(btn.dataset.r); if(type==='Sector') opts.angle=parseFloat(btn.dataset.angle); }
            else { opts.w = parseFloat(btn.dataset.w); opts.h = parseFloat(btn.dataset.h); }

            const rect = canvas.getBoundingClientRect();
            const cx = (rect.width/2 - translateX)/scale; const cy = (rect.height/2 - translateY)/scale;
            const s = new Shape(type, cx, cy, opts); shapes.push(s); selection = [s]; updatePropertiesPanel();
            saveState();
        }

        function handleAddText() {
            const input = document.getElementById('text-input'); const txt = input.value.trim(); if(!txt) return;
            const rect = canvas.getBoundingClientRect(); const cx = (rect.width/2 - translateX)/scale; const cy = (rect.height/2 - translateY)/scale;
            const t = new TextLabel(txt, cx, cy); shapes.push(t); selection = [t]; input.value = ''; interactionMode = 'geometry'; updatePropertiesPanel();
            saveState();
        }
        
        function updateToolbarUI() {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active', 'bg-blue-50', 'text-blue-600', 'border-blue-200'));
            if(interactionMode==='geometry') document.getElementById('tool-select').classList.add('active');
            if(interactionMode==='drawing') document.getElementById('tool-pen').classList.add('active');
            if(interactionMode==='text') document.getElementById('tool-text').classList.add('active');
            if(isErasing) document.getElementById('tool-eraser').classList.add('active');
            updatePropertiesPanel();
        }

        function initCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            translateX = canvas.width / 2;
            translateY = canvas.height / 2;
            scale = 1;
            
            window.addEventListener('resize', () => {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            });
            
            // Demos
            const r1 = new Shape('Rectangle', -120, -50, { w: 160, h: 100, color: '#60a5fa', alpha: 0.8 });
            const s1 = new Shape('Circle', 100, 50, { r: 60, color: '#f87171', alpha: 0.8 });
            shapes.push(r1, s1);

            const t1 = new TextLabel("拖曳我", 0, 150, { fontSize: 32, color: '#64748b' });
            shapes.push(t1);
            
            setupEventListeners();
            updateToolbarUI();
            saveState(); // Initial state
            requestAnimationFrame(drawLoop);
        }

        function drawLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            ctx.save();
            ctx.translate(translateX, translateY);
            ctx.scale(scale, scale);
            shapes.forEach(shape => shape.draw());

            // Draw Eraser Circle
            if (isErasing && lastMousePos) {
                 ctx.save();
                 ctx.beginPath();
                 ctx.arc(lastMousePos.x, lastMousePos.y, eraserWidth / scale, 0, Math.PI*2);
                 ctx.strokeStyle = '#ef4444'; // Red outline for eraser
                 ctx.lineWidth = 2/scale;
                 ctx.stroke();
                 // Inner semi-transparent fill
                 ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
                 ctx.fill();
                 ctx.restore();
            }

            if (isSelecting) {
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1 / scale; ctx.fillStyle = 'rgba(59, 130, 246, 0.1)';
                const w = selectionBox.currentX - selectionBox.startX; const h = selectionBox.currentY - selectionBox.startY;
                ctx.fillRect(selectionBox.startX, selectionBox.startY, w, h);
                ctx.strokeRect(selectionBox.startX, selectionBox.startY, w, h);
            }
            
            if (interactionMode === 'drawing' && drawingMode === 'straightLine' && straightLineStart && straightLineEnd) {
                 ctx.strokeStyle = penColor; ctx.lineWidth = penWidth / scale; ctx.beginPath();
                 ctx.moveTo(straightLineStart.x, straightLineStart.y); ctx.lineTo(straightLineEnd.x, straightLineEnd.y); ctx.stroke();
            }

            ctx.restore();
            requestAnimationFrame(drawLoop);
        }

        window.onload = initCanvas;
    </script>
</body>
