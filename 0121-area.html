<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡樂幾何拼接</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入圓體字型 (如果有網路) -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        /* 設定童趣字體 */
        body { font-family: 'Varela Round', 'Nunito', 'Microsoft JhengHei', sans-serif; }
        
        /* Canvas 容器設定 - 藍色方格紙風格 */
        #canvas-container {
            position: relative;
            overflow: hidden;
            border-radius: 1.5rem; /* 更圓的角 */
            background-color: #fffbeb; /* 淡淡的米黃色背景 */
            border: 4px solid #fbbf24; /* 亮黃色粗邊框 */
            /* 背景網格 - 藍色筆記本線條 */
            background-image: 
                linear-gradient(to right, #93c5fd 1px, transparent 1px),
                linear-gradient(to bottom, #93c5fd 1px, transparent 1px);
            background-size: 40px 40px; /* 網格大一點 */
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
        }
        
        /* 畫布本身設定 */
        #drawing-canvas {
            display: block;
            cursor: default;
            touch-action: none;
        }

        /* 工具列按鈕樣式 - 積木風格 */
        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem; /* 適度內距 */
            border-radius: 1rem; /* 更圓 */
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 彈跳效果 */
            min-width: 4rem; /* 稍微加寬以容納文字 */
            height: 4.5rem; /* 固定高度 */
            border: 2px solid transparent;
            background-color: white;
            box-shadow: 0 4px 0 #e5e7eb; /* 立體陰影 */
            margin-bottom: 4px; /* 預留陰影空間 */
        }
        .tool-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #d1d5db;
        }
        .tool-btn:active, .tool-btn.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d1d5db; /* 按下效果 */
            border-color: #3b82f6;
            background-color: #eff6ff;
            color: #2563eb;
        }
        /* Disabled state */
        .tool-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            background-color: #f3f4f6;
        }

        /* 圖形按鈕特定樣式 */
        .shape-btn svg {
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
            transition: transform 0.2s;
            width: 32px; /* 放大圖示 */
            height: 32px;
        }
        .shape-btn:hover svg {
            transform: scale(1.2) rotate(5deg); /* 懸停時稍微旋轉 */
        }

        /* 隱藏水平捲軸但保留功能 */
        .hide-scrollbar::-webkit-scrollbar {
            height: 8px; /* 顯示一點點捲軸比較好操作 */
        }
        .hide-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .hide-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 屬性列輸入框 - 圓潤 */
        .prop-input {
            transition: all 0.2s;
            border-radius: 0.5rem;
            border: 2px solid #e5e7eb;
        }
        .prop-input:focus {
            outline: none;
            border-color: #f472b6; /* 粉紅色聚焦 */
            box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.2);
        }
        
        /* 載入中遮罩 */
        #loading-overlay {
            backdrop-filter: blur(4px);
        }
        
        /* 布林運算按鈕 SVG 線條風格 */
        .bool-icon path, .bool-icon rect, .bool-icon circle {
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .bool-icon .fill-solid {
            fill: currentColor;
            stroke: none;
        }
        
        /* 狀態按鈕樣式 (上鎖/固定) */
        .state-btn.active {
            background-color: #fee2e2; /* Red-100 */
            color: #ef4444; /* Red-500 */
            border-color: #fecaca;
        }
    </style>
</head>
<body class="bg-blue-50 flex flex-col h-screen overflow-hidden text-slate-700">
    
    <!-- 1. 頂部標題與主工具列 -->
    <header class="bg-white shadow-md z-30 flex-none relative rounded-b-3xl mx-2 mt-2">
        <div class="flex items-center justify-between px-6 py-3 border-b border-gray-100">
            <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                <span class="text-3xl">🎨</span>
                <span class="hidden md:inline tracking-wide">歡樂幾何拼接</span>
            </h1>
            <div class="text-sm font-bold text-orange-500 bg-orange-100 px-4 py-1.5 rounded-full border border-orange-200">
                六年級：圓與扇形
            </div>
        </div>

        <!-- 工具捲動區 -->
        <div class="flex items-center gap-3 px-6 py-3 overflow-x-auto hide-scrollbar bg-white rounded-b-2xl">
            
            <!-- A. 選取/移動工具 -->
            <div class="flex items-center gap-2 pr-4 border-r-2 border-dashed border-gray-200">
                <button id="tool-select" class="tool-btn active group" title="選取與移動 (V)">
                    <span class="text-2xl">👆</span>
                    <span class="text-xs text-slate-500 font-bold mt-1">選取</span>
                </button>
            </div>

            <!-- B. 圖形工具箱 (圖示放大) -->
            <div class="flex items-center gap-2 pr-4 border-r-2 border-dashed border-gray-200">
                <span class="text-xs text-slate-400 font-bold mr-1 hidden lg:inline uppercase tracking-wider">圖形</span>
                
                <button class="tool-btn shape-btn" data-shape="Rectangle" data-w="160" data-h="100" title="長方形">
                    <svg viewBox="0 0 28 20"><rect width="28" height="20" fill="#60a5fa" stroke="#2563eb" stroke-width="2" rx="4"/></svg>
                </button>
                
                <button class="tool-btn shape-btn" data-shape="Square" data-s="120" title="正方形">
                    <svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#4ade80" stroke="#16a34a" stroke-width="2" rx="4"/></svg>
                </button>
                
                <button class="tool-btn shape-btn" data-shape="Triangle" data-w="120" data-h="120" data-offset="0" title="三角形">
                    <svg viewBox="0 0 24 24"><path d="M12 2L22 22H2Z" fill="#f472b6" stroke="#db2777" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>

                <button class="tool-btn shape-btn" data-shape="Parallelogram" data-w="140" data-h="80" data-offset="30" title="平行四邊形">
                    <svg viewBox="0 0 28 20"><path d="M6 2L26 2L22 18L2 18Z" fill="#2dd4bf" stroke="#0d9488" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>

                <button class="tool-btn shape-btn" data-shape="Trapezoid" data-w="140" data-w-top="90" data-h="80" title="梯形">
                    <svg viewBox="0 0 28 20"><path d="M6 2L22 2L26 18L2 18Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>
                
                <button class="tool-btn shape-btn" data-shape="Circle" data-r="60" title="圓形">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/></svg>
                </button>
                
                <button class="tool-btn shape-btn" data-shape="Sector" data-r="120" data-angle="90" title="1/4 圓扇形">
                    <svg viewBox="0 0 24 24"><path d="M12 12L22 12A10 10 0 0 0 12 2Z" fill="#f87171" stroke="#dc2626" stroke-width="2"/></svg>
                </button>

                <button class="tool-btn shape-btn" data-shape="Sector" data-r="120" data-angle="180" title="半圓形">
                    <svg viewBox="0 0 24 14"><path d="M2 12A10 10 0 0 1 22 12Z" fill="#c084fc" stroke="#9333ea" stroke-width="2"/></svg>
                </button>

                <!-- 運算符號 -->
                <div class="w-1 h-8 bg-gray-100 rounded-full mx-1"></div>

                <button class="tool-btn shape-btn" data-shape="Plus" data-w="80" data-h="80" title="加號">
                    <span class="text-xl font-black text-gray-500">＋</span>
                </button>

                <button class="tool-btn shape-btn" data-shape="Minus" data-w="80" data-h="25" title="減號">
                    <span class="text-xl font-black text-gray-500">－</span>
                </button>

                <button class="tool-btn shape-btn" data-shape="Times" data-w="70" data-h="70" title="乘號">
                    <span class="text-xl font-black text-gray-500">×</span>
                </button>

                <button class="tool-btn shape-btn" data-shape="Divide" data-w="70" data-h="70" title="除號">
                    <span class="text-xl font-black text-gray-500">÷</span>
                </button>

                <!-- 等號 -->
                <button class="tool-btn shape-btn" data-shape="Equals" data-w="70" data-h="50" title="等於">
                    <span class="text-xl font-black text-gray-500">＝</span>
                </button>
            </div>

            <!-- C. 註記工具 -->
            <div class="flex items-center gap-2 pr-4 border-r-2 border-dashed border-gray-200">
                <span class="text-xs text-slate-400 font-bold mr-1 hidden lg:inline uppercase tracking-wider">工具</span>
                
                <button id="tool-pen" class="tool-btn group" title="畫筆/註記">
                    <span class="text-2xl">✏️</span>
                    <span class="text-xs text-slate-500 font-bold mt-1">畫筆</span>
                </button>

                <button id="tool-text" class="tool-btn group" title="新增文字">
                    <span class="text-2xl">🔤</span>
                    <span class="text-xs text-slate-500 font-bold mt-1">文字</span>
                </button>

                <button id="tool-eraser" class="tool-btn group" title="橡皮擦">
                    <span class="text-2xl">🧼</span>
                    <span class="text-xs text-slate-500 font-bold mt-1">橡皮擦</span>
                </button>
            </div>

            <!-- D. 畫布操作 -->
            <div class="flex items-center gap-2">
                <button id="btn-undo" class="tool-btn group" title="復原 (Ctrl+Z)" disabled>
                    <span class="text-xl">↩️</span>
                    <span class="text-xs text-slate-500 font-bold mt-1">復原</span>
                </button>
                <button id="btn-redo" class="tool-btn group" title="重做 (Ctrl+Y)" disabled>
                    <span class="text-xl">↪️</span>
                    <span class="text-xs text-slate-500 font-bold mt-1">重做</span>
                </button>

                <div class="w-1 h-8 bg-gray-100 rounded-full mx-1"></div>

                <button id="reset-view-btn" class="tool-btn group" title="回到中心">
                    <span class="text-xl">🏠</span>
                    <span class="text-xs text-slate-500 font-bold mt-1">回到中心</span>
                </button>
                <button id="clear-canvas-btn" class="tool-btn group text-rose-500" title="清空畫布">
                    <span class="text-xl">🗑️</span>
                    <span class="text-xs text-rose-500 font-bold mt-1">清空</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 2. 圖形屬性列 -->
    <div id="properties-panel" class="bg-white border-2 border-indigo-100 shadow-lg px-4 py-3 flex items-center gap-4 overflow-x-auto whitespace-nowrap min-h-[4.5rem] flex-none z-20 mx-4 mt-2 rounded-2xl">
        
        <!-- A. 歡迎狀態 -->
        <div id="no-selection-message" class="flex items-center gap-2 text-slate-400 font-bold w-full justify-center">
            <span class="text-2xl animate-bounce">👇</span>
            <span>試試看點擊上方的圖形，開始拼貼吧！</span>
            <span class="text-2xl animate-bounce">👇</span>
        </div>

        <!-- B. 多選/群組操作區 -->
        <div id="multi-selection-panel" class="hidden flex items-center gap-4 w-full justify-center">
             <div class="flex items-center gap-2 text-indigo-600 font-black bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-200">
                 <span class="text-xl">📚</span>
                 <span>選了 <span id="selection-count" class="text-xl">0</span> 個</span>
             </div>
             
             <!-- 布林運算 -->
             <div class="flex items-center gap-2 px-4 border-l-2 border-r-2 border-dashed border-gray-200">
                 <button id="btn-union" class="p-2 bg-white hover:bg-green-50 border-2 border-transparent hover:border-green-200 rounded-xl text-gray-600 hover:text-green-600 transition" title="聯集 (合併)">
                     <svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 6 h8 v8 h-8 z" /><path d="M10 10 h8 v8 h-8 z" /><rect x="6" y="6" width="8" height="8" class="fill-solid opacity-20"/><rect x="10" y="10" width="8" height="8" class="fill-solid opacity-20"/></svg>
                 </button>
                 <button id="btn-difference" class="p-2 bg-white hover:bg-orange-50 border-2 border-transparent hover:border-orange-200 rounded-xl text-gray-600 hover:text-orange-600 transition" title="差集 (剪去)">
                     <svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 6 h8 v8 h-8 z" /><path d="M10 10 h8 v8 h-8 z" stroke-dasharray="2 2" class="opacity-50"/><rect x="6" y="6" width="8" height="8" class="fill-solid opacity-20" mask="url(#diff-mask)"/></svg>
                 </button>
                 <button id="btn-intersection" class="p-2 bg-white hover:bg-blue-50 border-2 border-transparent hover:border-blue-200 rounded-xl text-gray-600 hover:text-blue-600 transition" title="交集 (重疊)">
                     <svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 6 h8 v8 h-8 z" class="opacity-30"/><path d="M10 10 h8 v8 h-8 z" class="opacity-30"/><rect x="10" y="10" width="4" height="4" class="fill-solid opacity-80"/><path d="M10 10 h4 v4 h-4 z" stroke-width="2"/></svg>
                 </button>
                 <button id="btn-xor" class="p-2 bg-white hover:bg-purple-50 border-2 border-transparent hover:border-purple-200 rounded-xl text-gray-600 hover:text-purple-600 transition" title="互斥 (挖空)">
                     <svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 6 h8 v8 h-8 z" /><path d="M10 10 h8 v8 h-8 z" /><rect x="6" y="6" width="8" height="8" class="fill-solid opacity-10"/><rect x="10" y="10" width="8" height="8" class="fill-solid opacity-10"/><rect x="10" y="10" width="4" height="4" fill="white" stroke="none"/></svg>
                 </button>
             </div>
             
             <!-- 狀態控制 -->
             <div class="flex items-center gap-2">
                 <button id="batch-lock-btn" class="state-btn flex items-center gap-1 px-3 py-2 bg-white rounded-lg font-bold text-gray-500 hover:bg-gray-50">🔒 上鎖</button>
                 <button id="batch-fix-btn" class="state-btn flex items-center gap-1 px-3 py-2 bg-white rounded-lg font-bold text-gray-500 hover:bg-gray-50">📌 固定</button>
             </div>

             <div class="h-8 w-1 bg-gray-100 rounded-full mx-2"></div>
             
             <button id="group-btn" class="flex items-center gap-1 px-4 py-2 bg-indigo-500 text-white rounded-xl hover:bg-indigo-600 shadow-md transition active:scale-95 font-bold border-b-4 border-indigo-700 active:border-b-0 active:translate-y-1">
                 🔗 組合
             </button>
             
             <button id="delete-selection-btn" class="flex items-center gap-1 px-4 py-2 bg-white border-2 border-rose-200 text-rose-500 rounded-xl hover:bg-rose-50 shadow-sm transition active:scale-95 font-bold">
                 🗑️ 全部刪除
             </button>
        </div>
        
        <!-- C. 群組物件屬性 -->
        <div id="group-properties" class="hidden flex items-center gap-4 w-full justify-center">
             <div class="flex items-center gap-2 text-indigo-700 font-bold bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-200">
                 <span class="text-xl">📦</span>
                 <span>這是一組圖形</span>
             </div>
             
             <div class="flex items-center gap-2 ml-2">
                 <button id="group-lock-btn" class="state-btn px-3 py-2 bg-white rounded-lg font-bold text-gray-500">🔒 上鎖</button>
                 <button id="group-fix-btn" class="state-btn px-3 py-2 bg-white rounded-lg font-bold text-gray-500">📌 固定</button>
             </div>

             <div class="h-8 w-1 bg-gray-100 rounded-full mx-2"></div>

             <button id="ungroup-btn" class="flex items-center gap-1 px-4 py-2 bg-white border-2 border-indigo-300 text-indigo-700 rounded-xl hover:bg-indigo-50 shadow-md transition active:scale-95 font-bold">
                 🔓 拆開群組
             </button>
             
             <div class="flex items-center gap-3 ml-4">
                 <div class="flex bg-gray-100 rounded-xl p-1 shadow-inner">
                     <button id="grp-back" class="p-2 hover:bg-white rounded-lg text-gray-600 transition" title="移至最底層">⏬</button>
                     <button id="grp-down" class="p-2 hover:bg-white rounded-lg text-gray-600 transition" title="下移一層">⬇️</button>
                     <button id="grp-up" class="p-2 hover:bg-white rounded-lg text-gray-600 transition" title="上移一層">⬆️</button>
                     <button id="grp-front" class="p-2 hover:bg-white rounded-lg text-gray-600 transition" title="移至最頂層">⏫</button>
                 </div>
                 <button id="delete-group-btn" class="flex items-center gap-1 px-4 py-2 bg-white border-2 border-rose-200 text-rose-500 rounded-xl hover:bg-rose-50 font-bold">
                     🗑️ 刪除
                 </button>
             </div>
        </div>

        <!-- D. 單一圖形屬性控制區 -->
        <div id="shape-properties" class="hidden flex items-center gap-6 w-full px-2">
             <!-- 顏色與透明度 -->
             <div class="flex items-center gap-4 border-r-2 border-dashed border-indigo-100 pr-6">
                <div class="flex items-center gap-2 group relative cursor-pointer hover:scale-105 transition" title="換顏色">
                    <span class="text-2xl">🎨</span>
                    <input type="color" id="shape-color" class="w-10 h-10 rounded-full border-4 border-white shadow-md cursor-pointer p-0">
                </div>
                <div class="flex flex-col items-center" title="透明度">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">透明度</span>
                    <div class="flex items-center gap-1">
                        <span class="text-lg">👻</span>
                        <input type="range" id="shape-alpha" min="0" max="1" step="0.1" class="w-24 h-3 accent-indigo-500 bg-gray-200 rounded-full cursor-pointer">
                        <span id="alpha-display" class="text-xs font-bold text-indigo-600 w-8 text-center">70%</span>
                    </div>
                </div>
             </div>

             <!-- 線條粗細 -->
             <div class="flex flex-col items-center border-r-2 border-dashed border-indigo-100 pr-6" title="邊框粗細">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">框線</span>
                <div class="flex items-center gap-2">
                    <span class="text-lg">✏️</span>
                    <input type="range" id="shape-stroke-width" min="1" max="10" step="1" class="w-20 h-3 accent-indigo-500 bg-gray-200 rounded-full cursor-pointer">
                    <span id="stroke-width-display" class="text-xs font-bold text-indigo-600 w-4 text-center bg-indigo-50 rounded px-1">2</span>
                </div>
             </div>

             <!-- 尺寸與幾何 -->
             <div id="dim-input-group" class="flex items-center gap-3 border-r-2 border-dashed border-indigo-100 pr-6">
                <span class="text-2xl">📏</span>
                
                <div class="flex flex-col">
                    <span id="label-dim1" class="text-[10px] font-bold text-slate-400 uppercase text-center">W</span>
                    <input type="number" id="shape-dim1" class="prop-input w-20 px-2 py-1 text-base font-bold border-2 border-gray-200 rounded-lg text-center text-slate-700 bg-slate-50">
                </div>
                
                <div id="dim-input-2-container" class="flex flex-col">
                    <span id="label-dim2" class="text-[10px] font-bold text-slate-400 uppercase text-center">H</span>
                    <input type="number" id="shape-dim2" class="prop-input w-20 px-2 py-1 text-base font-bold border-2 border-gray-200 rounded-lg text-center text-slate-700 bg-slate-50">
                </div>

                 <div id="dim-input-top-container" class="hidden flex flex-col">
                    <span class="text-[10px] font-bold text-slate-400 uppercase text-center">Top</span>
                    <input type="number" id="shape-dim-top" class="prop-input w-20 px-2 py-1 text-base font-bold border-2 border-gray-200 rounded-lg text-center text-slate-700 bg-slate-50">
                </div>
             </div>
             
             <div id="angle-input-group" class="hidden flex items-center gap-2 border-r-2 border-dashed border-indigo-100 pr-6">
                 <span class="text-2xl">🍰</span>
                 <div class="flex flex-col">
                     <span class="text-[10px] font-bold text-slate-400 uppercase text-center">角度</span>
                     <input type="number" id="sector-angle" class="prop-input w-20 px-2 py-1 text-base font-bold border-2 border-gray-200 rounded-lg text-center text-slate-700 bg-slate-50">
                 </div>
             </div>
             
             <div id="apex-offset-group" class="hidden flex flex-col border-r-2 border-dashed border-indigo-100 pr-6">
                 <span class="text-[10px] font-bold text-slate-400 uppercase text-center mb-1">頂點位置</span>
                 <div class="flex items-center gap-2">
                     <span class="text-lg">📐</span>
                     <input type="range" id="shape-apex-offset-slider" class="w-24 h-3 accent-indigo-500 bg-gray-200 rounded-full cursor-pointer">
                     <span id="offset-display" class="text-xs font-bold text-indigo-600 w-8 text-center">0</span>
                     <input type="hidden" id="shape-apex-offset-value">
                 </div>
             </div>

             <div class="flex items-center gap-4 ml-auto">
                 <!-- 狀態控制 -->
                 <div class="flex items-center gap-2">
                     <button id="shape-lock-btn" class="state-btn px-3 py-2 bg-white rounded-lg font-bold text-gray-500 hover:bg-gray-50">🔒</button>

    <!-- 主工作區：Flex 佈局 -->
    <div class="flex flex-1 overflow-hidden p-4">
        <!-- 畫布區 -->
        <div class="flex-1 relative h-full">
            <div id="canvas-container" class="w-full h-full bg-white shadow-xl">
                <canvas id="drawing-canvas"></canvas>
            </div>
