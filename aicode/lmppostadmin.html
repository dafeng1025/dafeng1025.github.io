<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校務佈告欄管理 v1.4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-overlay { display: none; }
        .is-loading .loading-overlay { display: flex; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-start font-sans relative">
    
    <div class="loading-overlay fixed inset-0 bg-white bg-opacity-80 z-50 flex-col items-center justify-center">
        <svg class="animate-spin h-12 w-12 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span class="text-indigo-800 font-bold tracking-widest" id="loading-text">處理中...</span>
    </div>

    <!-- 登入畫面 -->
    <div id="login-section" class="w-full min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border-t-8 border-indigo-600">
            <div class="bg-slate-50 p-6 md:p-8 text-center border-b">
                <svg class="w-16 h-16 text-indigo-600 mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <h1 class="text-2xl font-extrabold text-indigo-900 mb-2">API 管理員身分驗證</h1>
                <p class="text-slate-500 text-sm font-medium">獨立前端版 - 請輸入系統密碼</p>
            </div>
            <div class="p-6 md:p-8">
                <form id="login-form" onsubmit="event.preventDefault(); attemptLogin();">
                    <div class="mb-6">
                        <input type="password" id="admin-password" required class="w-full border-2 border-slate-200 rounded-lg px-4 py-3 focus:ring-0 focus:border-amber-400 outline-none transition-colors text-center text-lg tracking-widest" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors flex items-center justify-center">
                        確認登入
                    </button>
                    <div class="mt-4 text-center">
                        <button type="button" onclick="window.location.href='lmppost.html'" class="text-sm font-semibold text-slate-500 hover:text-indigo-600 transition-colors">返回學生前台</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 管理員主畫面 -->
    <div id="admin-section" class="w-full hidden flex-col items-center">
        <header class="w-full bg-slate-800 text-white shadow-md border-b-4 border-indigo-500">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <h1 class="text-2xl md:text-3xl font-bold tracking-wider">校務佈告欄 - 管理系統</h1>
                    <span class="text-xs bg-slate-600 text-slate-100 px-2 py-1 rounded font-bold">API 版</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="logout()" class="flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow">登出</button>
                    <button onclick="window.location.href='lmppost.html'" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors border border-slate-500 shadow">返回學生前台</button>
                </div>
            </div>
        </header>

        <main class="w-full max-w-6xl p-4 md:p-8 mt-4">
            <div class="mb-6 flex justify-end">
                <button onclick="openFormModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:-translate-y-1 flex items-center">
                    發布新公告
                </button>
            </div>
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-indigo-50 text-indigo-900 text-sm uppercase tracking-wider border-b-2 border-indigo-200">
                                <th class="p-4 font-bold">狀態</th>
                                <th class="p-4 font-bold">發布時間</th>
                                <th class="p-4 font-bold w-1/3">標題</th>
                                <th class="p-4 font-bold text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增/編輯 表單 Modal -->
    <div id="form-modal" class="fixed inset-0 bg-slate-900 bg-opacity-70 hidden flex-col items-center justify-center px-4 z-40 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col border-t-8 border-indigo-600">
            <div class="bg-slate-50 px-6 py-4 flex justify-between items-center border-b">
                <h2 id="form-modal-title" class="text-xl font-extrabold text-indigo-900 flex items-center">編輯公告</h2>
                <button onclick="closeFormModal()" class="text-slate-400 hover:text-red-500 transition-colors">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="p-6 bg-white">
                <input type="hidden" id="edit-id">
                <div class="mb-5">
                    <label class="block text-sm font-bold text-indigo-900 mb-2">公告標題</label>
                    <input type="text" id="edit-title" class="w-full border-2 border-slate-200 rounded-lg px-4 py-3 focus:ring-0 focus:border-amber-400 outline-none transition-colors">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-bold text-indigo-900 mb-2">公告內容</label>
                    <textarea id="edit-content" rows="6" class="w-full border-2 border-slate-200 rounded-lg px-4 py-3 focus:ring-0 focus:border-amber-400 outline-none transition-colors"></textarea>
                </div>
                <div class="mb-2">
                    <label class="block text-sm font-bold text-indigo-900 mb-2">發布狀態</label>
                    <select id="edit-status" class="w-full border-2 border-slate-200 rounded-lg px-4 py-3 focus:ring-0 focus:border-amber-400 outline-none transition-colors font-semibold">
                        <option value="發布">🟢 公開發布 (學生前台可見)</option>
                        <option value="隱藏">⚪ 隱藏草稿 (僅管理員可見)</option>
                    </select>
                </div>
            </div>
            <div class="bg-slate-50 px-6 py-4 border-t flex justify-end gap-3">
                <button onclick="closeFormModal()" class="px-5 py-2.5 rounded-lg text-slate-600 font-bold hover:bg-slate-200 transition-colors">取消</button>
                <button onclick="saveData()" class="px-6 py-2.5 rounded-lg bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-md transition-colors">儲存</button>
            </div>
        </div>
    </div>

    <script>
        // =======================================================================
        // ★★★ 請將下方的網址替換為您 Google Apps Script 發布的網頁應用程式網址 ★★★
        // =======================================================================
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzObsBvS0oKrnJFyOPrmwycRri74xV7aYBrdp0G4arChC509BJclWeVT-EMbfgmrRUQ/exec'; 

        let adminData = [];
        let sessionToken = ''; 

        // 核心 API 呼叫函式
        async function fetchAPI(action, payload = {}) {
            if (GAS_API_URL === '請替換成您的_GAS_API_網址') {
                throw new Error("尚未設定 GAS_API_URL！請開啟原始碼修改。");
            }
            payload.action = action;
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (error) {
                throw error;
            }
        }

        async function attemptLogin() {
            const pwdInput = document.getElementById('admin-password').value;
            if(!pwdInput) return;

            setLoading(true, '驗證身分中...');
            
            try {
                const res = await fetchAPI('verifyPassword', { pwd: pwdInput });
                if(res.status === 'success' && res.isValid) {
                    sessionToken = pwdInput;
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('admin-section').style.display = 'flex';
                    loadData();
                } else {
                    setLoading(false);
                    alert('密碼錯誤！請重新輸入。');
                    document.getElementById('admin-password').value = '';
                }
            } catch(e) {
                setLoading(false);
                alert("API 連線錯誤：" + e.message);
            }
        }

        function logout() {
            sessionToken = ''; 
            document.getElementById('admin-password').value = '';
            document.getElementById('admin-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'flex';
        }

        async function loadData() {
            setLoading(true, '載入資料中...');
            try {
                const res = await fetchAPI('getAnnouncements', { isAdmin: true, pwd: sessionToken });
                setLoading(false);
                
                if (res.status !== 'success') { 
                    alert(res.message); 
                    if(res.message.includes('密碼')) logout();
                    return; 
                }
                
                adminData = res.data;
                const tbody = document.getElementById('admin-table-body');
                tbody.innerHTML = '';
                
                if (adminData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500 font-medium">目前尚無任何公告資料。</td></tr>`;
                    return;
                }

                adminData.forEach(item => {
                    const statusBadge = item.status === '發布' 
                        ? `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-200">🟢 已發布</span>`
                        : `<span class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-full border border-slate-200">⚪ 草稿</span>`;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-amber-50 transition-colors";
                    tr.innerHTML = `
                        <td class="p-4 whitespace-nowrap">${statusBadge}</td>
                        <td class="p-4 text-sm font-medium text-slate-500 whitespace-nowrap">${item.date}</td>
                        <td class="p-4 font-bold text-indigo-900 truncate max-w-[200px] md:max-w-md">${item.title}</td>
                        <td class="p-4 text-center whitespace-nowrap">
                            <button onclick="openFormModal('${item.id}')" class="text-indigo-600 hover:text-amber-500 font-extrabold text-sm mr-4 transition-colors">編輯</button>
                            <button onclick="deleteData('${item.id}')" class="text-red-500 hover:text-red-700 font-extrabold text-sm transition-colors">刪除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                setLoading(false);
                alert("資料載入失敗：" + e.message);
            }
        }

        function openFormModal(id = null) {
            const modal = document.getElementById('form-modal');
            const titleEl = document.getElementById('form-modal-title');
            if (id) {
                titleEl.innerText = `編輯公告`;
                const item = adminData.find(d => d.id === id);
                document.getElementById('edit-id').value = item.id;
                document.getElementById('edit-title').value = item.title;
                document.getElementById('edit-content').value = item.content;
                document.getElementById('edit-status').value = item.status;
            } else {
                titleEl.innerText = `發布新公告`;
                document.getElementById('edit-id').value = "";
                document.getElementById('edit-title').value = "";
                document.getElementById('edit-content').value = "";
                document.getElementById('edit-status').value = "發布";
            }
            modal.style.display = 'flex';
        }

        function closeFormModal() { document.getElementById('form-modal').style.display = 'none'; }

        async function saveData() {
            const payload = { 
                id: document.getElementById('edit-id').value, 
                title: document.getElementById('edit-title').value.trim(), 
                content: document.getElementById('edit-content').value.trim(), 
                status: document.getElementById('edit-status').value 
            };
            if (!payload.title || !payload.content) { alert("請填寫標題與內容！"); return; }
            
            setLoading(true, '儲存資料中...');
            closeFormModal();

            try {
                const res = await fetchAPI('saveAnnouncement', { data: payload, pwd: sessionToken });
                if(res.status === 'success') {
                    loadData();
                } else {
                    setLoading(false);
                    alert(res.message);
                    if(res.message.includes('密碼')) logout();
                }
            } catch(e) {
                setLoading(false);
                alert('儲存失敗：' + e.message);
            }
        }

        async function deleteData(id) {
            if (!confirm("確定要刪除這筆公告嗎？此動作無法復原。")) return;
            setLoading(true, '刪除資料中...');
            
            try {
                const res = await fetchAPI('deleteAnnouncement', { id: id, pwd: sessionToken });
                if(res.status === 'success') {
                    loadData();
                } else {
                    setLoading(false);
                    alert(res.message);
                    if(res.message.includes('密碼')) logout();
                }
            } catch(e) {
                setLoading(false);
                alert('刪除失敗：' + e.message);
            }
        }

        function setLoading(isLoading, text = '處理中...') {
            document.getElementById('loading-text').textContent = text;
            if (isLoading) document.body.classList.add('is-loading');
            else document.body.classList.remove('is-loading');
        }
    </script>
</body>
</html>
