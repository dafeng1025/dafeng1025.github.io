<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍目國小公開授課時間規畫表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .form-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        .form-fieldset {
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 1rem;
        }
        .form-fieldset legend {
            padding: 0 0.5rem;
            font-weight: 500;
            color: #1f2937;
        }
        /* 簡易的訊息提示樣式 */
        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            color: white;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1000;
        }
        #toast.show {
            opacity: 1;
            visibility: visible;
        }
        #toast.success { background-color: #28a745; }
        #toast.error { background-color: #dc3545; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <header class="text-center mb-8">
            <h1 id="main-title" class="text-3xl font-bold text-gray-700">高雄市大樹區龍目國民小學114學年度校長及教師公開授課時間規畫表</h1>
        </header>

        <!-- Main content area -->
        <main id="main-content">
            <!-- Form for adding new teaching sessions -->
            <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
                <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-600">新增公開授課資料</h2>
                <form id="lesson-form">
                    <div class="form-section">
                        <div>
                            <label for="teacher-name" class="block text-sm font-medium text-gray-700">授課人員</label>
                            <input type="text" id="teacher-name" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="class-grade" class="block text-sm font-medium text-gray-700">授課班級</label>
                            <input type="text" id="class-grade" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如：6年1班">
                        </div>
                        <div>
                            <label for="subject-name" class="block text-sm font-medium text-gray-700">領域名稱</label>
                            <input type="text" id="subject-name" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如：數學">
                        </div>
                        <div class="md:col-span-2">
                            <label for="teaching-unit" class="block text-sm font-medium text-gray-700">教學單元</label>
                            <input type="text" id="teaching-unit" required class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>
                    <div class="grid md:grid-cols-3 gap-4 mt-4">
                        <fieldset class="form-fieldset">
                            <legend>共同備課</legend>
                            <div class="space-y-4">
                                <div><label for="prep-date" class="block text-sm font-medium text-gray-700">日期</label><input type="date" id="prep-date" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                                <div><label for="prep-period" class="block text-sm font-medium text-gray-700">節次</label><input type="number" id="prep-period" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                                <div><label for="prep-location" class="block text-sm font-medium text-gray-700">地點</label><input type="text" id="prep-location" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                            </div>
                        </fieldset>
                        <fieldset class="form-fieldset">
                            <legend>教學觀察</legend>
                            <div class="space-y-4">
                                <div><label for="obs-date" class="block text-sm font-medium text-gray-700">日期</label><input type="date" id="obs-date" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                                <div><label for="obs-period" class="block text-sm font-medium text-gray-700">節次</label><input type="number" id="obs-period" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                                <div><label for="obs-location" class="block text-sm font-medium text-gray-700">地點</label><input type="text" id="obs-location" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                            </div>
                        </fieldset>
                        <fieldset class="form-fieldset">
                            <legend>專業回饋</legend>
                            <div class="space-y-4">
                                <div><label for="feed-date" class="block text-sm font-medium text-gray-700">日期</label><input type="date" id="feed-date" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                                <div><label for="feed-period" class="block text-sm font-medium text-gray-700">節次</label><input type="number" id="feed-period" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                                <div><label for="feed-location" class="block text-sm font-medium text-gray-700">地點</label><input type="text" id="feed-location" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></div>
                            </div>
                        </fieldset>
                    </div>
                    <div class="mt-6"><label for="observers" class="block text-sm font-medium text-gray-700">觀課人員</label><input type="text" id="observers" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="多位請用逗號分隔"></div>

                    <div class="mt-6 text-right">
                        <button type="submit" id="submit-btn" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors disabled:opacity-50">
                            新增資料
                        </button>
                    </div>
                </form>
            </div>

            <!-- Table for displaying lesson data -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                 <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                    <h2 id="list-title" class="text-xl font-bold text-gray-600">高雄市大樹區龍目國民小學114學年度校長及教師公開授課時間規畫表</h2>
                 </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-600">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                            <tr>
                                <th rowspan="2" class="px-4 py-3 border">編號</th>
                                <th rowspan="2" class="px-4 py-3 border">授課人員</th>
                                <th rowspan="2" class="px-4 py-3 border">授課班級</th>
                                <th rowspan="2" class="px-4 py-3 border min-w-[150px]">領域名稱</th>
                                <th rowspan="2" class="px-4 py-3 border min-w-[200px]">教學單元</th>
                                <th colspan="3" class="px-4 py-3 text-center border">共同備課</th>
                                <th colspan="3" class="px-4 py-3 text-center border">教學觀察</th>
                                <th colspan="3" class="px-4 py-3 text-center border">專業回饋</th>
                                <th rowspan="2" class="px-4 py-3 border">觀課人員</th>
                                <th rowspan="2" class="px-4 py-3 border">操作</th>
                            </tr>
                            <tr>
                                <th class="px-2 py-2 border">日期</th><th class="px-2 py-2 border">節次</th><th class="px-2 py-2 border">地點</th>
                                <th class="px-2 py-2 border">日期</th><th class="px-2 py-2 border">節次</th><th class="px-2 py-2 border">地點</th>
                                <th class="px-2 py-2 border">日期</th><th class="px-2 py-2 border">節次</th><th class="px-2 py-2 border">地點</th>
                            </tr>
                        </thead>
                        <tbody id="lesson-table-body" class="divide-y divide-gray-200">
                            <!-- Data rows will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast element for notifications -->
    <div id="toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // =================================================================
            // !! 請將您從 Google Apps Script 取得的網址貼在下方 !!
            // =================================================================
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPHbpGg7vFbuusTYIq595tRree_BoQSTew1bK5tU89SE6aT3FIfT9NdEJTFCwu6_t06A/exec';
            // =================================================================

            // DOM Elements
            const lessonForm = document.getElementById('lesson-form');
            const tableBody = document.getElementById('lesson-table-body');
            const submitBtn = document.getElementById('submit-btn');
            const toast = document.getElementById('toast');
            
            // App state
            let lessons = [];
            let lessonCounter = 1;

            const showToast = (message, type = 'success') => {
                toast.textContent = message;
                toast.className = '';
                toast.classList.add('show', type);
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            };
            
            // Load data from localStorage
            const loadState = () => {
                const savedLessons = localStorage.getItem('lessons');
                lessons = savedLessons ? JSON.parse(savedLessons) : [];
                lessonCounter = lessons.length > 0 ? Math.max(...lessons.map(l => l.id)) + 1 : 1;
                renderTable();
            };
            
            // Save data to localStorage
            const saveState = () => {
                localStorage.setItem('lessons', JSON.stringify(lessons));
            };

            // Render table rows
            const renderTable = () => {
                tableBody.innerHTML = '';
                if (lessons.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="16" class="text-center p-8 text-gray-500">尚未新增任何授課資料。</td></tr>`;
                    return;
                }
                lessons.forEach((lesson, index) => {
                    const row = document.createElement('tr');
                    row.className = 'bg-white hover:bg-gray-50 transition-colors';
                    row.innerHTML = `
                        <td class="px-4 py-3 border">${index + 1}</td>
                        <td class="px-4 py-3 border">${lesson.teacherName}</td>
                        <td class="px-4 py-3 border">${lesson.classGrade}</td>
                        <td class="px-4 py-3 border">${lesson.subjectName}</td>
                        <td class="px-4 py-3 border">${lesson.teachingUnit}</td>
                        <td class="px-2 py-2 border">${lesson.prepDate}</td><td class="px-2 py-2 border">${lesson.prepPeriod}</td><td class="px-2 py-2 border">${lesson.prepLocation}</td>
                        <td class="px-2 py-2 border">${lesson.obsDate}</td><td class="px-2 py-2 border">${lesson.obsPeriod}</td><td class="px-2 py-2 border">${lesson.obsLocation}</td>
                        <td class="px-2 py-2 border">${lesson.feedDate}</td><td class="px-2 py-2 border">${lesson.feedPeriod}</td><td class="px-2 py-2 border">${lesson.feedLocation}</td>
                        <td class="px-4 py-3 border">${lesson.observers}</td>
                        <td class="px-4 py-3 border text-center">
                            <button data-id="${lesson.id}" class="delete-btn text-red-600 hover:text-red-800 font-medium">刪除</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            };

            // Handle form submission
            lessonForm.addEventListener('submit', (e) => {
                e.preventDefault();

                if (SCRIPT_URL.includes('貼上您')) {
                    alert('請先在 HTML 檔案的 <script> 區塊中，貼上您的 Google Apps Script 網址！');
                    return;
                }
                
                const newLesson = {
                    id: lessonCounter,
                    teacherName: document.getElementById('teacher-name').value, classGrade: document.getElementById('class-grade').value,
                    subjectName: document.getElementById('subject-name').value, teachingUnit: document.getElementById('teaching-unit').value,
                    prepDate: document.getElementById('prep-date').value, prepPeriod: document.getElementById('prep-period').value, prepLocation: document.getElementById('prep-location').value,
                    obsDate: document.getElementById('obs-date').value, obsPeriod: document.getElementById('obs-period').value, obsLocation: document.getElementById('obs-location').value,
                    feedDate: document.getElementById('feed-date').value, feedPeriod: document.getElementById('feed-period').value, feedLocation: document.getElementById('feed-location').value,
                    observers: document.getElementById('observers').value,
                };

                submitBtn.disabled = true;
                submitBtn.textContent = '傳送中...';

                const formData = new FormData();
                for (const key in newLesson) {
                    formData.append(key, newLesson[key]);
                }

                fetch(SCRIPT_URL, { method: 'POST', body: formData })
                    .then(response => response.json())
                    .then(data => {
                        if (data.result === 'success') {
                            showToast('成功寫入 Google Sheet！');
                            lessons.push(newLesson);
                            lessonCounter++;
                            saveState();
                            renderTable();
                            lessonForm.reset();
                        } else {
                            throw new Error(data.message || '寫入 Google Sheet 失敗');
                        }
                    })
                    .catch(error => {
                        console.error('寫入 Google Sheet 時發生錯誤:', error);
                        showToast('寫入 Google Sheet 失敗，但資料已在本機儲存。', 'error');
                        lessons.push(newLesson);
                        lessonCounter++;
                        saveState();
                        renderTable();
                        lessonForm.reset();
                    })
                    .finally(() => {
                        submitBtn.disabled = false;
                        submitBtn.textContent = '新增資料';
                    });
            });

            // Handle delete button clicks
            tableBody.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-btn')) {
                    if(confirm('確定要刪除這筆資料嗎？(此操作不會刪除 Google Sheet 中的資料)')) {
                        const idToDelete = parseInt(e.target.dataset.id, 10);
                        lessons = lessons.filter(lesson => lesson.id !== idToDelete);
                        saveState();
                        renderTable();
                        showToast('本機資料已刪除。');
                    }
                }
            });

            // Initial load
            loadState();
        });
    </script>
</body>
</html>
