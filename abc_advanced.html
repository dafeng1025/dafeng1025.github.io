    <style>
        body {
            font-family: 'Baloo 2', cursive;
            background-color: #a7e6ff; /* Light sky blue */
            position: relative;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
            filter: blur(2px);
            animation: moveClouds 25s linear infinite;
        }
        .cloud:before, .cloud:after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud1 { width: 100px; height: 100px; top: 10%; left: -150px; }
        .cloud1:before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud1:after { width: 80px; height: 80px; top: -10px; right: 10px; }
        
        .cloud2 { width: 150px; height: 150px; top: 30%; left: -200px; animation-duration: 35s; }
        .cloud2:before { width: 90px; height: 90px; top: -50px; left: 30px; }
        .cloud2:after { width: 120px; height: 120px; top: -20px; right: 20px; }

        .cloud3 { width: 80px; height: 80px; top: 70%; left: -120px; animation-duration: 20s; }
        .cloud3:before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud3:after { width: 60px; height: 60px; top: -10px; right: 10px; }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        .card {
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border: 5px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15), inset 0 0 10px rgba(255,255,255,0.5);
        }
        .card-face-back {
            transform: rotateY(180deg);
        }
        .perspective-1000 {
            perspective: 1500px;
        }
        
        .custom-choice input:checked + div {
            background-color: #34d399; /* emerald-400 */
            border-color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .custom-choice input:checked + div span {
            color: white;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }
        .custom-choice input:checked + div .icon-container {
            background-color: white;
        }
        .custom-choice input:checked + div .selection-icon {
            transform: scale(1);
            opacity: 1;
            color: #10b981; /* emerald-500 */
        }
        .custom-choice .selection-icon {
            transform: scale(0);
            opacity: 0;
            transition: all 0.2s ease-in-out;
        }
        
        .btn-bouncy {
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
        }
        .btn-bouncy:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .btn-bouncy:active {
            transform: translateY(2px) scale(0.98);
        }
    </style>

        document.addEventListener('DOMContentLoaded', () => {
            // DOM 元素
            const wordListsContainer = document.getElementById('word-lists-container');
            const quizModeContainer = document.getElementById('quiz-mode-container');
            const card = document.getElementById('card');
            const wordText = document.getElementById('word-text');
            const answerText = document.getElementById('answer-text');
            const showAnswerBtn = document.getElementById('show-answer-btn');
            const nextWordBtn = document.getElementById('next-word-btn');
            const messageArea = document.getElementById('message-area');
            const speakBtnFront = document.getElementById('speak-btn-front');
            const speakBtnBack = document.getElementById('speak-btn-back');

            // 應用程式狀態
            let allWords = {};
            let activeWords = [];
            let currentWord = null;
            let isFlipped = false;
            let quizMode = 'en-to-zh';
            let timerId = null;
            let countdownInterval = null;
            let audioCtx = null;
            let isTimerActive = false;
            let isQuizStarted = false;

            // 初始化函式
            function init() {
                for (const fileName in fileContents) {
                    allWords[fileName] = parseWordList(fileContents[fileName]);
                }
                createWordListCheckboxes();
                createQuizModeRadios();
                updateActiveWords();
                showAnswerBtn.addEventListener('click', handleShowAnswer);
                nextWordBtn.addEventListener('click', handleNextWord);
                wordListsContainer.addEventListener('change', updateActiveWords);
                quizModeContainer.addEventListener('change', handleModeChange);
                speakBtnFront.addEventListener('click', handleSpeak);
                speakBtnBack.addEventListener('click', handleSpeak);
                updateButtonStates();
            }

            // [修正] 更新解析函式以正確處理所有單字庫格式
            function parseWordList(text) {
                const words = [];
                const lines = text.trim().replace(/\r\n/g, '\n').split('\n');
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const firstSpaceIndex = line.indexOf(' ');
                    if (firstSpaceIndex > 0) {
                        const english = line.substring(0, firstSpaceIndex).trim();
                        const chinese = line.substring(firstSpaceIndex + 1).trim();
                        if (english && chinese) {
                            words.push({ english, chinese });
                        }
                    }
                }
                return words;
            }

            function createCustomCheckbox(id, name, value, text, checked = true) {
                return `
                    <label for="${id}" class="custom-choice block cursor-pointer">
                        <input type="checkbox" id="${id}" data-list-name="${value}" class="sr-only" ${checked ? 'checked' : ''}>
                        <div class="flex items-center justify-between p-3 bg-white/80 rounded-xl border-2 border-white hover:border-emerald-200 hover:bg-white transition-all duration-200 shadow-sm">
                            <span class="text-slate-700 font-bold transition-colors">${text}</span>
                            <div class="icon-container w-7 h-7 flex items-center justify-center rounded-lg bg-emerald-100 transition-colors">
                                <i class="fas fa-check selection-icon text-emerald-500"></i>
                            </div>
                        </div>
                    </label>
                `;
            }
            
            function createCustomRadio(id, name, value, text, checked = false) {
                 return `
                    <label for="${id}" class="custom-choice block cursor-pointer">
                        <input type="radio" id="${id}" name="${name}" value="${value}" class="sr-only" ${checked ? 'checked' : ''}>
                        <div class="flex items-center justify-between p-3 bg-white/80 rounded-xl border-2 border-white hover:border-emerald-200 hover:bg-white transition-all duration-200 shadow-sm">
                            <span class="text-slate-700 font-bold transition-colors">${text}</span>
                            <div class="icon-container w-7 h-7 flex items-center justify-center rounded-lg bg-emerald-100 transition-colors">
                                <i class="fas fa-check selection-icon text-emerald-500"></i>
                            </div>
                        </div>
                    </label>
                `;
            }


            function createWordListCheckboxes() {
                let html = '';
                Object.keys(fileContents).forEach((fileName, index) => {
                    html += createCustomCheckbox(`list-${index}`, 'wordlist', fileName, `${fileName} (${allWords[fileName].length})`, true);
                });
                wordListsContainer.innerHTML = html;
            }
            
            function createQuizModeRadios() {
                const modes = [
                    { value: 'en-to-zh', text: '英翻中' },
                    { value: 'zh-to-en', text: '中翻英' },
                    { value: 'fill-in-the-blank', text: '單字填空' }
                ];
                let html = '';
                modes.forEach((mode, index) => {
                    html += createCustomRadio(`mode-${index}`, 'quizMode', mode.value, mode.text, index === 0);
                });
                quizModeContainer.innerHTML = html;
            }


            function updateActiveWords() {
                activeWords = [];
                const checkboxes = wordListsContainer.querySelectorAll('input[type="checkbox"]:checked');
                checkboxes.forEach(cb => {
                    const listName = cb.dataset.listName;
                    if (allWords[listName]) {
                        activeWords.push(...allWords[listName]);
                    }
                });
                
                const uniqueWords = new Map();
                activeWords.forEach(word => {
                    if (!uniqueWords.has(word.english.toLowerCase())) {
                        uniqueWords.set(word.english.toLowerCase(), word);
                    }
                });
                activeWords = Array.from(uniqueWords.values());
                
                resetQuiz();
            }
            
            function updateButtonStates() {
                const hasActiveWords = activeWords.length > 0;
                nextWordBtn.disabled = !hasActiveWords;
                showAnswerBtn.disabled = !currentWord || !hasActiveWords;
            }
            
            function displayMessage() {
                 if (activeWords.length === 0) {
                    messageArea.textContent = '請至少選擇一個單字庫！';
                    wordText.textContent = '...';
                    answerText.textContent = '';
                    currentWord = null;
                } else {
                    messageArea.textContent = '';
                }
            }
            
            function resetQuiz() {
                if (isFlipped) {
                    card.classList.remove('is-flipped');
                    isFlipped = false;
                }
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                }
                 if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                document.getElementById('timer-display').classList.add('hidden');
                isTimerActive = false;
                isQuizStarted = false;
                nextWordBtn.textContent = '開始';
                currentWord = null;
                wordText.textContent = '?';
                wordText.classList.remove('tracking-widest');
                answerText.textContent = '';
                speakBtnFront.classList.add('hidden');
                speakBtnBack.classList.add('hidden');
                updateButtonStates();
                displayMessage();
            }

            function createBlankWord(word) {
                const wordArr = word.split('');
                const len = wordArr.length;
                // Ensure at least one blank for all words.
                const numBlanks = Math.max(1, Math.floor(len * 0.4));
                const availableIndices = Array.from(Array(len).keys());
                
                for (let i = 0; i < numBlanks; i++) {
                    if (availableIndices.length === 0) break;
                    const randomIndex = Math.floor(Math.random() * availableIndices.length);
                    const selectedIndex = availableIndices.splice(randomIndex, 1)[0];
                    wordArr[selectedIndex] = '_';
                }
                return wordArr.join('');
            }

            function handleShowAnswer() {
                if (!currentWord || isFlipped) return;
                card.classList.add('is-flipped');
                isFlipped = true;
            }

            function handleNextWord() {
                if (activeWords.length === 0) {
                    displayMessage();
                    return;
                }
                
                if (!isQuizStarted) {
                    isQuizStarted = true;
                    nextWordBtn.textContent = '下一題';
                }

                resetQuizTimer();

                if (isFlipped) {
                    card.classList.remove('is-flipped');
                    isFlipped = false;
                }
                
                const randomIndex = Math.floor(Math.random() * activeWords.length);
                currentWord = activeWords[randomIndex];

                setTimeout(() => {
                    wordText.classList.remove('tracking-widest');
                    speakBtnFront.classList.add('hidden');
                    speakBtnBack.classList.add('hidden');

                    if (quizMode === 'en-to-zh') {
                        wordText.textContent = currentWord.english;
                        answerText.textContent = currentWord.chinese;
                        speakBtnFront.classList.remove('hidden');
                    } else if (quizMode === 'zh-to-en') {
                        wordText.textContent = currentWord.chinese;
                        answerText.textContent = currentWord.english;
                        speakBtnBack.classList.remove('hidden');
                    } else { // fill-in-the-blank
                        wordText.textContent = createBlankWord(currentWord.english);
                        answerText.textContent = currentWord.english;
                        wordText.classList.add('tracking-widest');
                        speakBtnFront.classList.remove('hidden'); 
                        speakBtnBack.classList.remove('hidden'); 
                    }
                }, isFlipped ? 300 : 0);
                
                updateButtonStates();
            }

            function handleModeChange(e) {
                quizMode = e.target.value;
                resetQuiz();
            }
            
            function resetQuizTimer() {
                 if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                }
                 if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                document.getElementById('timer-display').classList.add('hidden');
                isTimerActive = false;
            }


            function playTimeoutSound() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 1); 
            }

            // 發音功能
            function handleSpeak(event) {
                event.stopPropagation(); // 防止點擊喇叭時翻牌
                if (!currentWord || !window.speechSynthesis) {
                    return;
                }

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const utterance = new SpeechSynthesisUtterance(currentWord.english);
                utterance.lang = 'en-US';
                speechSynthesis.speak(utterance);

                if (!isTimerActive) {
                    isTimerActive = true;
                    if (timerId) clearTimeout(timerId);
                    if (countdownInterval) clearInterval(countdownInterval);

                    const timerDisplay = document.getElementById('timer-display');
                    let timeLeft = 10;
                    timerDisplay.textContent = timeLeft;
                    timerDisplay.classList.remove('hidden');

                    countdownInterval = setInterval(() => {
                        timeLeft--;
                        timerDisplay.textContent = timeLeft;
                        if (timeLeft <= 0) {
                            clearInterval(countdownInterval);
                            timerDisplay.classList.add('hidden');
                        }
                    }, 1000);

                    timerId = setTimeout(() => {
                        playTimeoutSound();
                    }, 10000);
                }
            }

            // 啟動應用程式
            init();
        });
    </script>
