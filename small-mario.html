<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小瑪莉機台 / 課堂互動工具</title>
    <style>
        /* ================= 基礎與色彩變數 ================= */
        :root {
            --bg-dark: #1a1a2e;
            --panel-bg: #e0e0e0;
            --cell-bg: #ffffff;
            --text-dark: #2c3e50;
            --led-red: #ff3333;
            --led-bg: #330000;
            --gold: #f1c40f;
            --active-border: #e74c3c;
            --active-glow: rgba(231, 76, 60, 0.8);
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
            overflow-x: hidden;
        }

        /* ================= 主機台外殼 ================= */
        .machine-casing {
            background-color: var(--panel-bg);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 15px 50px rgba(0,0,0,0.8);
            border: 4px solid #bdc3c7;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* ================= 上方面板 (LED 與投幣) ================= */
        .top-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #2c3e50;
            border-radius: 10px;
            border: 3px solid #34495e;
        }

        .led-group {
            display: flex;
            gap: 20px;
        }

        .led-display {
            background-color: var(--led-bg);
            border: 3px solid #111;
            padding: 5px 15px;
            border-radius: 8px;
            text-align: center;
            min-width: 120px;
        }

        .led-title {
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .led-digits {
            color: var(--led-red);
            font-family: 'Courier New', Courier, monospace;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--led-red);
            letter-spacing: 2px;
        }

        .btn-coin {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #f1c40f; 
            color: #8e44ad;
            box-shadow: 0 4px 0 #b38f00;
            transition: all 0.1s;
        }
        .btn-coin:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        /* ================= 遊戲網格區 (6x6) ================= */
        .board {
            display: grid;
            grid-template-columns: repeat(6, 75px);
            grid-template-rows: repeat(6, 75px);
            gap: 6px;
            background-color: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 4px solid #7f8c8d;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .cell {
            background-color: var(--cell-bg);
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 26px;
            color: var(--text-dark);
            transition: all 0.05s linear;
            text-align: center;
            line-height: 1.1;
            padding: 2px;
            box-sizing: border-box;
        }

        .cell-icon {
            font-size: 26px;
            line-height: 1;
        }
        
        .cell-odds {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 2px;
        }

        .cell.type-jackpot .cell-icon { color: #c0392b; font-size: 20px; }
        .cell.type-bonus .cell-icon { color: #2980b9; font-size: 16px; background-color: #e8f4f8;}

        .cell.active {
            background-color: var(--active-border);
            color: white !important;
            border-color: #c0392b;
            box-shadow: 0 0 15px var(--active-glow), inset 0 0 10px rgba(255,255,255,0.5);
            transform: scale(1.1);
            z-index: 10;
        }

        /* 跑燈亮起時，倍率文字跟著變白 */
        .cell.active .cell-odds {
            color: #fdfdfd;
        }

        .center-display {
            grid-area: 2 / 2 / 6 / 6;
            background-color: #2980b9;
            border: 4px solid var(--gold);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .center-title { color: #ecf0f1; font-size: 18px; margin-bottom: 10px; text-shadow: 1px 1px 2px #000; }
        .center-result { 
            color: var(--gold); 
            font-size: 40px; 
            font-weight: bold; 
            text-shadow: 0 0 15px var(--gold), 2px 2px 4px #000; 
            text-align: center;
        }

        /* ================= 擬真街機操作面板 (對照圖片) ================= */
        .arcade-panel {
            width: 100%;
            margin-top: 25px;
            background-color: #111;
            border: 3px solid var(--gold);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.1);
            position: relative;
            z-index: 5;
        }

        .arcade-top-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        /* 底部押注區塊白色底板 */
        .arcade-bet-strip {
            background-color: #fdfdfd;
            border: 4px solid #27ae60;
            border-radius: 6px;
            padding: 12px 8px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: inset 0 3px 10px rgba(0,0,0,0.2);
        }

        /* 模擬實體立體按鍵 */
        .mech-btn {
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            border: 2px solid #bdc3c7;
            border-bottom: 6px solid #95a5a6;
            border-radius: 6px;
            min-width: 55px;
            height: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            font-family: 'Microsoft JhengHei', sans-serif;
            position: relative;
        }

        .mech-btn:active {
            transform: translateY(4px);
            border-bottom: 2px solid #95a5a6;
        }

        .mech-btn:disabled {
            filter: grayscale(100%);
            opacity: 0.7;
            cursor: not-allowed;
            transform: translateY(4px);
            border-bottom: 2px solid #95a5a6;
        }

        .bet-icon { font-size: 22px; line-height: 1; margin-bottom: 2px; }
        .bet-count { color: #e74c3c; font-size: 14px; font-weight: bold; background: #fff; padding: 0 4px; border-radius: 4px; border: 1px solid #ccc; min-width: 20px; text-align: center; }
        
        /* 獨立功能按鈕樣式 */
        .btn-refund { border-bottom-color: #c0392b; color: #c0392b; font-weight: bold; font-size: 16px; width: 80px; }
        .btn-refund:active { border-bottom-color: #c0392b; }
        
        .btn-start { border-bottom-color: #219150; color: #27ae60; font-weight: bold; font-size: 18px; width: 100px; }
        .btn-start:active { border-bottom-color: #219150; }

        /* ================= 中間功能按鈕區 (WIN/DOUBLE/IN/BET) ================= */
        .middle-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex: 1;
            margin: 0 10px;
        }

        .btn-action {
            width: 65px;
            height: 60px;
            border-bottom-color: #7f8c8d;
        }
        
        .action-text {
            font-weight: bold;
            font-size: 12px;
            line-height: 1.3;
            text-align: center;
        }
        .text-blue { color: #2980b9; }
        .text-red { color: #c0392b; }
        .text-green { color: #27ae60; }
        .text-yellow { color: #d35400; }

        /* ================= 退幣動畫特效 ================= */
        #coin-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 避免擋住點擊 */
            z-index: 100;
            overflow: hidden;
        }

        .falling-coin {
            position: absolute;
            font-size: 35px;
            animation: coinDropAnim 0.8s cubic-bezier(0.3, -0.2, 0.7, 1.2) forwards;
            text-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        @keyframes coinDropAnim {
            0% { transform: translateY(-30px) rotateY(0deg) scale(0.5); opacity: 0; }
            20% { opacity: 1; scale: 1; }
            100% { transform: translateY(400px) rotateY(360deg); opacity: 0; }
        }

        /* ================= 退彩結算畫面 (鈔票/硬幣視覺化) ================= */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px; /* 貼齊外殼的圓角 */
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-content {
            background: #ecf0f1;
            border: 6px solid #f1c40f;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            width: 85%;
            max-width: 550px;
            max-height: 85%;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .money-display {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 25px 0;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
            min-height: 100px;
        }
        /* 鈔票與硬幣樣式 (模擬台幣色系) */
        .note { 
            width: 90px; height: 45px; border-radius: 4px; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; color: white; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); border: 2px dashed rgba(255,255,255,0.4); 
            font-size: 18px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
        }
        .note-1000 { background: linear-gradient(135deg, #0984e3, #74b9ff); } /* 藍色小朋友 */
        .note-500 { background: linear-gradient(135deg, #8d6e63, #a1887f); }  /* 咖啡色棒球隊 */
        .note-100 { background: linear-gradient(135deg, #d63031, #ff7675); }  /* 紅色國父 */
        
        .coin-ui { 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; box-shadow: inset 0 0 5px rgba(0,0,0,0.3), 2px 2px 5px rgba(0,0,0,0.4); 
        }
        .coin-50 { width: 45px; height: 45px; background: radial-gradient(circle, #f1c40f, #e67e22); color: #fff; text-shadow: 1px 1px 1px #d35400; border: 2px solid #e67e22; font-size: 18px;}
        .coin-10 { width: 38px; height: 38px; background: radial-gradient(circle, #ecf0f1, #bdc3c7); color: #2c3e50; border: 2px solid #95a5a6; font-size: 16px;}
        .coin-5 { width: 34px; height: 34px; background: radial-gradient(circle, #ecf0f1, #bdc3c7); color: #2c3e50; border: 2px solid #95a5a6; font-size: 14px;}
        .coin-1 { width: 30px; height: 30px; background: radial-gradient(circle, #e67e22, #d35400); color: #fff; border: 2px solid #a04000; font-size: 14px;}

        /* RWD 微調 */
        @media (max-width: 600px) {
            .board { grid-template-columns: repeat(6, 50px); grid-template-rows: repeat(6, 50px); }
            .cell-icon { font-size: 16px; }
            .cell.type-jackpot .cell-icon { font-size: 12px; }
            .cell.type-bonus .cell-icon { font-size: 10px; }
            .cell-odds { font-size: 10px; margin-bottom: 1px; }
            .center-result { font-size: 24px; }
            .led-digits { font-size: 24px; }
            .mech-btn { min-width: 40px; height: 50px; }
            .bet-icon { font-size: 16px; }
            .btn-refund, .btn-start { width: 60px; font-size: 14px;}
            
            /* 行動版按鈕微調 */
            .middle-buttons { gap: 4px; margin: 0 5px; }
            .btn-action { width: 48px; height: 50px; }
            .action-text { font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="machine-casing">
    <!-- 動態退幣特效容器 -->
    <div id="coin-container"></div>

    <!-- 上方 LED 與投幣 -->
    <div class="top-panel">
        <div class="led-group">
            <div class="led-display" id="scorePanel">
                <span class="led-title">中獎得分 (WIN)</span>
                <div class="led-digits" id="displayScore">0000</div>
            </div>
            <div class="led-display" id="creditPanel">
                <span class="led-title">投幣餘額 (CREDIT)</span>
                <div class="led-digits" id="displayCredit">0000</div>
            </div>
        </div>
        <button class="btn-coin" id="btnCoin">🪙 投幣</button>
    </div>

    <!-- 遊戲網格 -->
    <div class="board" id="gameBoard">
        <div class="center-display">
            <div class="center-title" id="centerTitle">歡迎遊玩</div>
            <div class="center-result" id="centerResult">請投幣押注</div>
        </div>
    </div>

    <!-- 擬真街機操作面板 -->
    <div class="arcade-panel" id="bottomPanel">
        <div class="arcade-top-row">
            <button class="mech-btn btn-refund" id="btnRefund">退彩</button>
            
            <!-- 新增的中間功能按鍵區 -->
            <div class="middle-buttons">
                <button class="mech-btn btn-action" id="btnCreditToWin">
                    <span class="action-text text-blue">CREDIT<br>轉<br>WIN</span>
                </button>
                <button class="mech-btn btn-action" id="btnWinToCredit">
                    <span class="action-text text-blue">WIN<br>轉<br>CREDIT</span>
                </button>
                <button class="mech-btn btn-action" id="btnDoubleSmall">
                    <span class="action-text text-red">比倍<br>小(1-4)</span>
                </button>
                <button class="mech-btn btn-action" id="btnDoubleBig">
                    <span class="action-text text-red">比倍<br>大(6-9)</span>
                </button>
            </div>

            <button class="mech-btn btn-start" id="btnStart">START<br>開始</button>
        </div>
        
        <div class="arcade-bet-strip" id="betGrid">
            <!-- 押注機械按鈕由 JS 動態生成 -->
        </div>
    </div>

    <!-- 退彩結算金額視覺化 Modal -->
    <div id="refundModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 style="color: #c0392b; margin-top: 0; font-size: 28px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">💰 退彩結算 💰</h2>
            <p style="font-size: 22px; font-weight: bold; color: #2c3e50;">總計退回：<span id="refundTotalAmount" style="color: #e74c3c; font-size: 32px;">0</span> 點</p>
            <div id="moneyDisplay" class="money-display">
                <!-- JS 動態生成鈔票硬幣 -->
            </div>
            <button id="btnCloseModal" class="btn-start" style="font-size: 20px; padding: 12px 40px; margin-top: 10px; width: auto; color: white;">確認收下</button>
        </div>
    </div>

</div>

<script>
    /* ==========================================================================
       網頁合成器 (Web Audio API)
       ========================================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function unlockAudio() {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration, vol=0.1) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const soundFX = {
        tick: () => playTone(800, 'square', 0.05, 0.05),
        coin: () => { playTone(987.77, 'sine', 0.1, 0.1); setTimeout(()=>playTone(1318.51, 'sine', 0.3, 0.1), 100); },
        win: () => { 
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.2, 0.1), i*100));
        },
        jackpot: () => {
            for(let i=0; i<10; i++) {
                setTimeout(() => playTone(400 + (i%2)*200, 'square', 0.1, 0.1), i*100);
            }
            setTimeout(() => playTone(800, 'sine', 1, 0.2), 1000);
        },
        bonus: () => {
            [880, 987, 1046, 1174, 1318].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.1, 0.1), i*80));
        },
        // 新增退幣音效
        refundDrop: () => {
            [1000, 1200, 1500].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.1, 0.05), i*50));
        }
    };

    /* ==========================================================================
       TTS 語音服務
       ========================================================================== */
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    }

    /* ==========================================================================
       遊戲資料定義
       ========================================================================== */
    const odds = { "777": 100, "BAR": 50, "⭐️": 30, "🍉": 20, "🔔": 15, "🍊": 10, "🍒": 5, "🍎": 2 };

    const themeClassic = [
        { icon: "🍎", weight: 60, type: 'normal', id: "🍎" }, { icon: "🍊", weight: 45, type: 'normal', id: "🍊" },
        { icon: "🔔", weight: 30, type: 'normal', id: "🔔" }, { icon: "🍉", weight: 20, type: 'normal', id: "🍉" },
        { icon: "⭐️", weight: 15, type: 'normal', id: "⭐️" }, { icon: "🍒", weight: 50, type: 'normal', id: "🍒" },
        { icon: "🍊", weight: 45, type: 'normal', id: "🍊" }, { icon: "🔔", weight: 30, type: 'normal', id: "🔔" },
        { icon: "BAR",weight: 5,  type: 'jackpot',id: "BAR"}, { icon: "🍎", weight: 60, type: 'normal', id: "🍎" },
        { icon: "🍒", weight: 50, type: 'normal', id: "🍒" }, { icon: "🍉", weight: 20, type: 'normal', id: "🍉" },
        { icon: "⭐️", weight: 15, type: 'normal', id: "⭐️" }, { icon: "777",weight: 2,  type: 'jackpot',id: "777"},
        { icon: "送燈",weight: 8,  type: 'bonus',  id: "送燈"}, { icon: "🍎", weight: 60, type: 'normal', id: "🍎" },
        { icon: "🍊", weight: 45, type: 'normal', id: "🍊" }, { icon: "🔔", weight: 30, type: 'normal', id: "🔔" },
        { icon: "🍒", weight: 50, type: 'normal', id: "🍒" }, { icon: "🍉", weight: 20, type: 'normal', id: "🍉" }
    ];

    /* ==========================================================================
       狀態變數與 DOM 元素
       ========================================================================== */
    let totalCredit = 0;
    let currentScore = 0;
    let currentBets = {}; 
    let isRunning = false;
    let isBettingEnabled = true;
    let currentIndex = 0;
    let isTransferring = false; // 新增狀態：是否正在洗分
    
    const domCells = [];
    const board = document.getElementById('gameBoard');
    const betGrid = document.getElementById('betGrid');
    const displayCredit = document.getElementById('displayCredit');
    const displayScore = document.getElementById('displayScore');
    const centerResult = document.getElementById('centerResult');
    const centerTitle = document.getElementById('centerTitle');
    const btnStart = document.getElementById('btnStart');
    const coinContainer = document.getElementById('coin-container');

    /* ==========================================================================
       初始化佈局
       ========================================================================== */
    function initBoard() {
        domCells.forEach(cell => cell.remove());
        domCells.length = 0;

        const coords = [];
        for (let col = 1; col <= 6; col++) coords.push({ r: 1, c: col });
        for (let row = 2; row <= 6; row++) coords.push({ r: row, c: 6 });
        for (let col = 5; col >= 1; col--) coords.push({ r: 6, c: col });
        for (let row = 5; row >= 2; row--) coords.push({ r: row, c: 1 });

        coords.forEach((coord, i) => {
            const data = themeClassic[i];
            const div = document.createElement('div');
            div.className = `cell type-${data.type}`;
            div.style.gridArea = `${coord.r} / ${coord.c} / ${coord.r+1} / ${coord.c+1}`;
            
            // 判斷是否為特殊獎項 (如送燈)，如果是則不顯示倍率
            if (data.type === 'bonus') {
                div.innerHTML = `<div class="cell-icon">${data.icon}</div>`;
            } else {
                // 讀取 odds 物件中的倍率，顯示在上方
                const multiplier = odds[data.id];
                div.innerHTML = `
                    <div class="cell-odds">x${multiplier}</div>
                    <div class="cell-icon">${data.icon}</div>
                `;
            }
            
            board.appendChild(div);
            domCells.push(div);
        });
    }

    // 依據實體按鍵風格初始化押注面板
    function initBettingPanel() {
        betGrid.innerHTML = '';
        currentBets = {};
        
        const uniqueItems = ["🍎", "🍊", "🔔", "🍉", "⭐️", "🍒", "BAR", "777"];
        
        uniqueItems.forEach(item => {
            currentBets[item] = 0;
            const btn = document.createElement('button');
            btn.className = 'mech-btn';
            btn.innerHTML = `
                <div class="bet-icon">${item}</div>
                <div class="bet-count" id="bet-count-${item}">0</div>
            `;
            btn.onclick = () => {
                unlockAudio();
                if (!isBettingEnabled || isRunning) return;
                if (totalCredit > 0) {
                    totalCredit--;
                    currentBets[item]++;
                    document.getElementById(`bet-count-${item}`).innerText = currentBets[item];
                    updateLED();
                    soundFX.tick();
                } else {
                    speakText("點數不足，請投幣");
                }
            };
            betGrid.appendChild(btn);
        });
    }

    function updateLED() {
        displayCredit.innerText = String(totalCredit).padStart(4, '0');
        displayScore.innerText = String(currentScore).padStart(4, '0');
    }

    /* ==========================================================================
       核心遊戲邏輯
       ========================================================================== */
    function getWeightedTargetIndex() {
        let totalWeight = themeClassic.reduce((sum, item) => sum + item.weight, 0);
        let randomNum = Math.floor(Math.random() * totalWeight);
        for (let i = 0; i < themeClassic.length; i++) {
            randomNum -= themeClassic[i].weight;
            if (randomNum < 0) return i;
        }
        return 0;
    }

    function calculatePayout(winningIndices) {
        let handScore = 0;
        let wonItems = new Set();
        let resultTexts = [];

        winningIndices.forEach(idx => {
            const data = themeClassic[idx];
            resultTexts.push(data.icon);

            if (data.type !== 'bonus') {
                const betCount = currentBets[data.id] || 0;
                if (betCount > 0 && !wonItems.has(data.id)) {
                    handScore += odds[data.id] * betCount;
                    wonItems.add(data.id);
                }
            }
        });

        centerResult.innerText = resultTexts.join(" & ");
        
        // 移除先前的自動得分轉入，讓使用者可以手動玩比倍或洗分
        // (此邏輯移至 startSpin 中處理)

        if (handScore > 0) {
            currentScore = handScore;
            updateLED();
            speakText(`恭喜中獎，獲得 ${handScore} 分`);
        } else {
            currentScore = 0;
            updateLED();
            speakText("再接再厲");
        }
        
        initBettingPanel(); // 清空押注
        isRunning = false;
        isBettingEnabled = true;
        btnStart.disabled = false;
    }

    async function executeBonusSequence(sourceIndex) {
        speakText("送燈獎勵！");
        soundFX.bonus();
        centerResult.innerText = "加碼送燈中!";
        
        const delay = ms => new Promise(res => setTimeout(res, ms));
        let finalIndices = [sourceIndex];
        
        let available = themeClassic.map((_, i) => i).filter(i => themeClassic[i].type !== 'bonus' && i !== sourceIndex);
        
        for(let i=0; i<2; i++) {
            if(available.length === 0) break;
            await delay(600);
            let randIdx = Math.floor(Math.random() * available.length);
            let target = available.splice(randIdx, 1)[0];
            finalIndices.push(target);
            
            domCells[target].classList.add('active');
            soundFX.tick();
        }
        
        await delay(500);
        
        const hasJackpot = finalIndices.some(idx => themeClassic[idx].type === 'jackpot');
        if(hasJackpot) soundFX.jackpot(); else soundFX.win();
        
        calculatePayout(finalIndices);
    }

    function startSpin() {
        unlockAudio();
        if (isRunning || isTransferring) return;

        // 如果點擊 START 時，上次的中獎得分還在，自動幫他轉入 CREDIT
        if (currentScore > 0) {
            totalCredit += currentScore;
            currentScore = 0;
            updateLED();
        }

        const totalBet = Object.values(currentBets).reduce((a,b)=>a+b, 0);
        if (totalBet === 0) {
            speakText("請先押注");
            return;
        }

        isRunning = true;
        isBettingEnabled = false;
        btnStart.disabled = true;
        
        domCells.forEach(c => c.classList.remove('active'));
        centerResult.innerText = "旋轉中...";
        centerTitle.innerText = "祝您好運";

        const targetIndex = getWeightedTargetIndex();
        let stepsNeeded = (20 * 3) + targetIndex - currentIndex; 
        if (stepsNeeded < 60) stepsNeeded += 20;

        let currentStep = 0;
        let speed = 40; 

        function animate() {
            domCells[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % 20;
            domCells[currentIndex].classList.add('active');
            
            soundFX.tick();
            currentStep++;

            if (currentStep > stepsNeeded * 0.8) {
                speed += 20;
            } else if (currentStep > stepsNeeded * 0.6) {
                speed += 5;
            }

            if (currentStep < stepsNeeded) {
                setTimeout(animate, speed);
            } else {
                const finalData = themeClassic[currentIndex];
                if (finalData.type === 'bonus') {
                    executeBonusSequence(currentIndex);
                } else {
                    if(finalData.type === 'jackpot') soundFX.jackpot(); else soundFX.win();
                    calculatePayout([currentIndex]);
                }
            }
        }
        animate();
    }

    /* ==========================================================================
       退幣動畫特效邏輯
       ========================================================================== */
    function triggerRefundAnimation(coinsToDrop) {
        // 限制畫面上一次最多掉落數量避免效能問題
        const maxDrops = Math.min(coinsToDrop, 30); 
        
        for (let i = 0; i < maxDrops; i++) {
            setTimeout(() => {
                const coin = document.createElement('div');
                coin.className = 'falling-coin';
                coin.innerText = '🪙';
                // 隨機掉落起始位置 (集中在中下方出幣口附近)
                coin.style.left = (Math.random() * 60 + 20) + '%'; 
                coin.style.top = '60%';
                
                coinContainer.appendChild(coin);
                soundFX.refundDrop();

                // 動畫結束後移除 DOM
                setTimeout(() => coin.remove(), 800);
            }, i * 80); // 每隔 80 毫秒掉落一個
        }
    }

    // 結算金額視覺化轉換邏輯
    function showRefundModal(amount) {
        document.getElementById('refundTotalAmount').innerText = amount;
        const display = document.getElementById('moneyDisplay');
        display.innerHTML = ''; // 清空上次的畫面

        // 貪婪演算法：從最大面額開始換算
        let remaining = amount;
        const notes1000 = Math.floor(remaining / 1000); remaining %= 1000;
        const notes500 = Math.floor(remaining / 500); remaining %= 500;
        const notes100 = Math.floor(remaining / 100); remaining %= 100;
        const coins50 = Math.floor(remaining / 50); remaining %= 50;
        const coins10 = Math.floor(remaining / 10); remaining %= 10;
        const coins5 = Math.floor(remaining / 5); remaining %= 5;
        const coins1 = remaining;

        const addElements = (count, className, text) => {
            for(let i=0; i<count; i++) {
                const el = document.createElement('div');
                el.className = className;
                el.innerText = text;
                display.appendChild(el);
            }
        };

        // 依序加入 DOM
        addElements(notes1000, 'note note-1000', '1000');
        addElements(notes500, 'note note-500', '500');
        addElements(notes100, 'note note-100', '100');
        addElements(coins50, 'coin-ui coin-50', '50');
        addElements(coins10, 'coin-ui coin-10', '10');
        addElements(coins5, 'coin-ui coin-5', '5');
        addElements(coins1, 'coin-ui coin-1', '1');

        // 顯示 Modal 並播放歡樂音效
        document.getElementById('refundModal').classList.remove('hidden');
        soundFX.win(); 
    }

    document.getElementById('btnCloseModal').addEventListener('click', () => {
        soundFX.tick();
        document.getElementById('refundModal').classList.add('hidden');
    });

    /* ==========================================================================
       新功能鍵邏輯 (WIN<->CREDIT, DOUBLE)
       ========================================================================== */
    
    // 1a. CREDIT 轉 WIN (換分：將餘額轉至得分區以進行比倍)
    document.getElementById('btnCreditToWin').addEventListener('click', () => {
        unlockAudio();
        if (totalCredit <= 0 || isRunning || isTransferring) return;
        
        // 點擊一次轉移 1 分到 WIN 區
        totalCredit -= 1;
        currentScore += 1;
        updateLED();
        soundFX.tick();
    });

    // 1b. WIN 轉 CREDIT (洗分：一次性將所有得分洗為信用點數)
    document.getElementById('btnWinToCredit').addEventListener('click', () => {
        unlockAudio();
        if (currentScore <= 0 || isRunning || isTransferring) return;
        
        isTransferring = true;
        let transferInterval = setInterval(() => {
            if (currentScore > 0) {
                // 根據數量決定跳動速度，加速洗分
                let step = currentScore > 100 ? 10 : (currentScore > 10 ? 5 : 1);
                if (step > currentScore) step = currentScore;
                
                currentScore -= step;
                totalCredit += step;
                updateLED();
                soundFX.tick(); 
            } else {
                clearInterval(transferInterval);
                isTransferring = false;
                soundFX.coin(); // 結束音
            }
        }, 60); // 每 60 毫秒跳一次，模擬機台洗分感
    });

    // 2. DOUBLE 比倍 (拆分為 小 1-4 / 大 6-9)
    function playDouble(guessType) {
        unlockAudio();
        if (currentScore <= 0 || isRunning || isTransferring) {
            if(currentScore <= 0 && !isRunning) speakText("沒有得分可以比倍");
            return;
        }

        isRunning = true;
        centerTitle.innerText = "比倍中...";
        centerResult.innerText = "開牌...";
        
        // 播放一點懸疑效果音
        soundFX.tick();
        setTimeout(() => soundFX.tick(), 200);
        setTimeout(() => soundFX.tick(), 400);

        setTimeout(() => {
            // 產生 1~9 的數字 (傳統機台 5 為莊家通吃)
            const roll = Math.floor(Math.random() * 9) + 1; 
            let won = false;

            if (guessType === 'small' && roll >= 1 && roll <= 4) won = true;
            if (guessType === 'big' && roll >= 6 && roll <= 9) won = true;

            if (won) {
                currentScore *= 2;
                updateLED();
                soundFX.jackpot();
                speakText(`開出 ${roll}，比倍成功`);
                centerResult.innerText = `[ ${roll} ] 勝！`;
            } else {
                currentScore = 0;
                updateLED();
                playTone(150, 'sawtooth', 0.8, 0.1); // 失敗低鳴聲
                speakText(`開出 ${roll}，比倍失敗`);
                centerResult.innerText = `[ ${roll} ] 敗`;
            }
            setTimeout(() => { 
                if(!isRunning && centerTitle.innerText === "比倍中...") {
                    centerTitle.innerText = "歡迎遊玩"; 
                }
            }, 2000);
            isRunning = false;
        }, 1200);
    }

    document.getElementById('btnDoubleSmall').addEventListener('click', () => playDouble('small'));
    document.getElementById('btnDoubleBig').addEventListener('click', () => playDouble('big'));

    /* ==========================================================================
       事件綁定
       ========================================================================== */
    document.getElementById('btnCoin').addEventListener('click', () => {
        unlockAudio();
        soundFX.coin();
        totalCredit += 10;
        updateLED();
    });

    document.getElementById('btnRefund').addEventListener('click', () => {
        unlockAudio();
        if (isRunning) return;

        // 將 WIN 得分與 CREDIT 合計一併退掉
        const totalToRefund = totalCredit + currentScore;

        if (totalToRefund > 0) {
            triggerRefundAnimation(totalToRefund);
            speakText(`退幣 ${totalToRefund} 點`);
            
            totalCredit = 0;
            currentScore = 0;
            updateLED();
            
            // 清除如果有點擊但未開始跑的押注
            initBettingPanel(); 

            // 延遲顯示鈔票硬幣結算畫面 (等噴錢動畫跑差不多再彈出)
            setTimeout(() => {
                showRefundModal(totalToRefund);
            }, 800);

        } else {
            speakText("目前沒有餘額");
        }
    });

    btnStart.addEventListener('click', startSpin);

    // 初始啟動
    initBoard();
    initBettingPanel();

</script>
</body>
