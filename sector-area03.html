<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圓面積與扇形面積分解教具</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 設定主要字體 */
        body { font-family: 'Inter', sans-serif; }
        /* Canvas 容器確保畫布可以拖曳 */
        #canvas-container {
            position: relative;
            overflow: hidden;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            background-color: #f9fafb;
        }
        /* 畫布本身設定 */
        #drawing-canvas {
            display: block;
            cursor: default; /* 預設游標 */
            touch-action: none; /* 禁用瀏覽器觸控平移/縮放，讓 JS 處理 */
        }
        /* 互動元件的基本樣式 */
        .interactive-tool {
            transition: all 0.15s ease-in-out;
            transform: scale(1);
        }
        .interactive-tool:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        /* 響應式佈局調整 */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .tool-panel {
                order: -1; /* 工具箱在手機上移到最上方 */
            }
        }
    </style>
</head>
<body class="bg-gray-100 p-4 lg:p-8">
    <!-- 標題區域 -->
    <header class="mb-6 relative">
        <h1 class="text-3xl font-bold text-gray-800">📐 組合圖形面積分解互動教具</h1>
        <p class="text-gray-600">六年級上學期：圓面積與扇形面積。拖曳圖形至畫布，進行分解與疊加。</p>
        <!-- 新增備註標籤 -->
        <div class="absolute top-0 right-0 text-xs text-gray-500 bg-gray-200 px-3 py-1 rounded-bl-lg rounded-tr-lg shadow-sm hidden lg:block">
            此網頁為 Gemini Canvas 協力產出
        </div>
    </header>

    <!-- 主內容區：網格佈局 (工具箱 + 畫布 + 屬性調整) -->

                </svg>
            </h2>
            <!-- 修改：預設為 hidden (隱藏) -->
            <div id="shape-palette" class="grid grid-cols-2 gap-3 hidden">

                    <span class="font-bold">三角形</span>
                    <span class="text-sm">100x100 (底x高)</span>
                </button>
                <button class="add-shape-btn interactive-tool bg-yellow-100 text-yellow-800 p-3 rounded-lg flex flex-col items-center" data-shape="Circle" data-r="50">
                    <span class="font-bold">圓形</span>

    <script>
        // 數學常數
        const PI = 3.14;

        // 畫布與上下文
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // 狀態管理
        let shapes = []; // 儲存所有幾何圖形物件的陣列
        let textLabels = []; // 儲存所有文字標註物件的陣列 (新增)
        let selectedShape = null;
        let selectedAnnotation = null;
        let selectedText = null; // 新增
        let isDragging = false;
        let isResizing = false;
        let isRotating = false;
        let dragOffsetX, dragOffsetY;

        // --- Annotation State ---
        let annotations = []; 
        let interactionMode = 'geometry'; // 'geometry' or 'drawing'
        let drawingMode = 'freehand'; // 'freehand', 'straightLine'
        let isErasing = false; // 新增
        let isAddingText = false; // 新增
        let isDrawing = false;
        let currentAnnotation = null;
        let straightLineStart = null;
        let straightLineEnd = null;
        let penColor = '#000000';
        let penWidth = 3;
        // ------------------------

        // 視角控制 (平移與縮放)
        let translateX = 0;
        let translateY = 0;
        let scale = 1;
        let isPanning = false;

        // ----------------------------------------------------
        // I. 幾何計算與繪圖核心 (Shape Class)
        // ----------------------------------------------------

        class Shape {
            constructor(type, x, y, options = {}) {
                this.id = Date.now() + Math.random();
                this.type = type; // 'Square', 'Rectangle', 'Circle', 'Sector', 'Triangle'
                this.x = x;
                this.y = y;
                this.rotation = options.rotation || 0; 
                this.color = options.color || '#3b82f6';
                this.alpha = options.alpha !== undefined ? options.alpha : 0.7;
                // this.mode 屬性已移除 

                // Dimensions
                this.r = options.r || 50; 
                this.w = options.w || 100; // Base/Width (底邊)
                this.h = options.h || 100; // Height (高)
                this.w_top = options.w_top || 80; // Trapezoid top base (梯形上底)
                this.angle = options.angle || 90; 
                this.apexOffset = options.apexOffset || 0; // Triangle/Parallelogram offset (頂點/頂邊偏移)
            }

            // 1. 移除 calculateArea() 函式，因為不再計算總面積。
            
            // 2. 繪製圖形
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // 設定樣式
                const baseColor = this.color;
                const alphaValue = this.alpha;
                const fillColor = `rgba(${parseInt(baseColor.slice(1, 3), 16)}, ${parseInt(baseColor.slice(3, 5), 16)}, ${parseInt(baseColor.slice(5, 7), 16)}, ${alphaValue})`;
                
                ctx.fillStyle = fillColor;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2 / scale;

                ctx.beginPath();
                switch (this.type) {
                    case 'Square':
                    case 'Rectangle':
                        ctx.rect(-this.w / 2, -this.h / 2, this.w, this.h);
                        break;
                    case 'Circle':
                        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
                        break;
                    case 'Sector':
                        const startAngle = 0;
                        const endAngle = (this.angle * Math.PI) / 180;
                        ctx.moveTo(0, 0); 
                        ctx.arc(0, 0, this.r, startAngle, endAngle);
                        ctx.closePath();
                        break;
                    case 'Triangle':
                        // Draw triangle with adjustable apex offset
                        // Base points are fixed at y = h/2 (bottom)
                        // Apex point is fixed at y = -h/2 (top)
                        ctx.moveTo(-this.w / 2, this.h / 2); // Bottom Left
                        ctx.lineTo(this.w / 2, this.h / 2);  // Bottom Right
                        ctx.lineTo(this.apexOffset, -this.h / 2); // Top Apex (Offset from center x=0)
                        ctx.closePath();
                        break;
                    case 'Parallelogram':
                        ctx.moveTo(-this.w / 2, this.h / 2); // Bottom Left
                        ctx.lineTo(this.w / 2, this.h / 2);  // Bottom Right
                        ctx.lineTo(this.w / 2 + this.apexOffset, -this.h / 2); // Top Right
                        ctx.lineTo(-this.w / 2 + this.apexOffset, -this.h / 2); // Top Left
                        ctx.closePath();
                        break;
                    case 'Trapezoid': // Isosceles Trapezoid (等腰梯形)
                        ctx.moveTo(-this.w / 2, this.h / 2); // Bottom Left
                        ctx.lineTo(this.w / 2, this.h / 2);  // Bottom Right
                        ctx.lineTo(this.w_top / 2, -this.h / 2); // Top Right
                        ctx.lineTo(-this.w_top / 2, -this.h / 2); // Top Left
                        ctx.closePath();
                        break;
                }

                ctx.fill();
                ctx.stroke();
                ctx.restore();

                if (selectedShape === this) {
                    this.drawControls();
                }
            }
            
            // 3. 繪製選中邊界和控制點 (簡化)
            drawControls() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 1.5 / scale;
                ctx.setLineDash([4 / scale, 4 / scale]); 

                let bounds;
                switch (this.type) {
                    case 'Circle':
                        bounds = { w: this.r * 2, h: this.r * 2 };
                        ctx.beginPath();
                        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
                        ctx.stroke();
                        break;
                    case 'Sector':
                        bounds = { w: this.r, h: this.r };
                        ctx.strokeRect(0, 0, this.r, this.r);
                        this.drawControlPoint(0, 0, 'blue');
                        this.drawControlPoint(this.r, 0, 'red'); 
                        this.drawControlPoint(0, -this.r * 0.75, 'green', 'rotate');
                        ctx.restore();
                        return;

                    case 'Square':
                    case 'Rectangle':
                    case 'Triangle': // 使用邊界框
                    case 'Parallelogram': // 使用邊界框
                    case 'Trapezoid': // 使用邊界框
                        bounds = { w: this.w, h: this.h };
                        ctx.strokeRect(-bounds.w / 2, -bounds.h / 2, bounds.w, bounds.h);
                        break;
                }

                ctx.setLineDash([]); 
                
                // 繪製旋轉控制點 (在中心上方)
                this.drawControlPoint(0, -bounds.h / 2 - 20 / scale, 'green', 'rotate');

                // 繪製縮放控制點 (右下角)
                this.drawControlPoint(bounds.w / 2, bounds.h / 2, 'red', 'resize');
                
                ctx.restore();
            }

            // 4. 繪製單個控制點
            drawControlPoint(cx, cy, color, type) {
                const size = 5 / scale;
                ctx.fillStyle = color;
                ctx.fillRect(cx - size, cy - size, size * 2, size * 2);
            }

            // 5. 判斷點擊是否在圖形內部 (簡化)
            containsPoint(mx, my) {
                const dx = mx - this.x;
                const dy = my - this.y;
                
                const cos = Math.cos(-this.rotation);
                const sin = Math.sin(-this.rotation);
                const localX = dx * cos - dy * sin;
                const localY = dy * cos + dx * sin; // Correct rotation formula

                switch (this.type) {
                    case 'Square':
                    case 'Rectangle':
                        return localX >= -this.w / 2 && localX <= this.w / 2 &&
                            localY >= -this.h / 2 && localY <= this.h / 2;
                    case 'Triangle':
                    case 'Parallelogram':
                    case 'Trapezoid':
                        // Use bounding box for simplicity in dragging
                        return localX >= -this.w / 2 && localX <= this.w / 2 &&
                            localY >= -this.h / 2 && localY <= this.h / 2;
                    case 'Circle':
                        return Math.sqrt(dx * dx + dy * dy) <= this.r;
                    case 'Sector':
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > this.r) return false;
                        let angle = Math.atan2(dy, dx) - this.rotation;
                        if (angle < 0) angle += 2 * Math.PI;
                        if (angle > 2 * Math.PI) angle -= 2 * Math.PI;
                        const sectorEndAngle = (this.angle * Math.PI) / 180;
                        return angle >= 0 && angle <= sectorEndAngle;
                    default:
                        return false;
                }
            }

            // 6. 檢查是否點擊了控制點 (保持不變)
            checkControls(mx, my) {
                const dx = mx - this.x;
                const dy = my - this.y;
                const cos = Math.cos(-this.rotation);
                const sin = Math.sin(-this.rotation);
                const localX = dx * cos - dy * sin;
                const localY = dy * cos + dx * sin; // Correct rotation formula
                const hitSize = 10 / scale;

                if (this.type === 'Sector') {
                    if (Math.abs(localX - this.r) < hitSize && Math.abs(localY - 0) < hitSize) { return 'resize'; }
                    if (Math.abs(localX - 0) < hitSize && Math.abs(localY - (-this.r * 0.75)) < hitSize) { return 'rotate'; }
                    return null;
                }

                let bounds = (this.type === 'Circle') ? { w: this.r * 2, h: this.r * 2 } : { w: this.w, h: this.h };

                if (Math.abs(localX - bounds.w / 2) < hitSize && Math.abs(localY - bounds.h / 2) < hitSize) { return 'resize'; }
                if (Math.abs(localX - 0) < hitSize && Math.abs(localY - (-bounds.h / 2 - 20 / scale)) < hitSize) { return 'rotate'; }

                return null;
            }
        }

        // ----------------------------------------------------
        // II. Annotation Class (可拖曳線條/註記)
        // ----------------------------------------------------

        class Annotation {
            constructor(points, color, width, x = 0, y = 0) {
                this.id = Date.now() + Math.random();
                this.type = 'Annotation'; 
                this.points = points; 
                this.color = color;
                this.width = width;
                this.x = x; 
                this.y = y;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width / scale;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Highlight if selected
                if (selectedAnnotation === this) {
                    // 1. Draw dashed selection box (框框)
                    ctx.save(); 
                    ctx.strokeStyle = 'red';
                    ctx.lineWidth = 1.5 / scale;
                    ctx.setLineDash([4 / scale, 4 / scale]);

                    // Calculate bounds based on relative points
                    let minX = Infinity, minY = Infinity;
                    let maxX = -Infinity, maxY = -Infinity;
                    for (const p of this.points) {
                        minX = Math.min(minX, p.x);
                        maxX = Math.max(maxX, p.x);
                        minY = Math.min(minY, p.y);
                        maxY = Math.max(maxY, p.y);
                    }
                    // Add small padding based on line width and scale
                    const padding = (this.width + 4) / (2 * scale); 
                    const width = maxX - minX;
                    const height = maxY - minY;
                    ctx.strokeRect(minX - padding, minY - padding, width + 2 * padding, height + 2 * padding);
                    ctx.setLineDash([]);
                    ctx.restore(); 

                    // 2. Enhance line visibility with shadow/glow
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color; 
                    ctx.lineWidth = (this.width + 2) / scale; // Slightly thicker line
                }

                ctx.beginPath();
                if (this.points.length > 0) {
                    ctx.moveTo(this.points[0].x, this.points[0].y);
                    for (let i = 1; i < this.points.length; i++) {
                        ctx.lineTo(this.points[i].x, this.points[i].y);
                    }
                }
                ctx.stroke();
                ctx.restore();
            }

            containsPoint(mx, my, tolerance = 0) {
                const localMx = mx - this.x;
                const localMy = my - this.y;
                tolerance = (this.width / 2 + 8 + tolerance) / scale; 

                for (let i = 0; i < this.points.length - 1; i++) {
                    const p1 = this.points[i];
                    const p2 = this.points[i + 1];

                    // Simple bounding box check around the segment
                    const minX = Math.min(p1.x, p2.x) - tolerance;
                    const maxX = Math.max(p1.x, p2.x) + tolerance;
                    const minY = Math.min(p1.y, p2.y) - tolerance;
                    const maxY = Math.max(p1.y, p2.y) + tolerance;

                    if (localMx >= minX && localMx <= maxX && localMy >= minY && localMy <= maxY) {
                         return true;
                    }
                }
                return false;
            }
        }

        // --- Helper for creating Annotation objects ---
        function createAnnotation(points, color, width) {
            if (points.length < 2) return;

            let minX = Infinity, minY = Infinity;
            let maxX = -Infinity, maxY = -Infinity;

            for (const p of points) {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            }

            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;

            const relativePoints = points.map(p => ({
                x: p.x - centerX,
                y: p.y - centerY
            }));

            const newAnnotation = new Annotation(relativePoints, color, width, centerX, centerY);
            annotations.push(newAnnotation);
            setSelectedAnnotation(newAnnotation);
        }
        
        // ----------------------------------------------------
        // III. TextLabel Class (新增)
        // ----------------------------------------------------

        class TextLabel {
            constructor(text, x, y, options = {}) {
                this.id = Date.now() + Math.random();
                this.type = 'TextLabel';
                this.text = text;
                this.x = x;
                this.y = y;
                this.color = options.color || '#000000';
                this.fontSize = options.fontSize || 24;
                this.w = 0; 
                this.h = this.fontSize; 
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.fillStyle = this.color;
                // Use a standard font size and scale down
                const currentFontSize = this.fontSize / scale;
                ctx.font = `bold ${currentFontSize}px Inter, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.fillText(this.text, 0, 0);

                // Get actual text metrics for hit-testing (approximation)
                const metrics = ctx.measureText(this.text);
                // Store unscaled dimensions for consistent hit-testing logic
                this.w = metrics.width * scale; 
                this.h = currentFontSize * 1.2 * scale;
                
                if (selectedText === this) {
                    ctx.strokeStyle = 'red';
                    ctx.lineWidth = 1.5 / scale;
                    ctx.setLineDash([4 / scale, 4 / scale]);
                    // Draw bounding box (unscaled dimensions divided by scale)
                    ctx.strokeRect(-this.w / (2 * scale), -this.h / (2 * scale), this.w / scale, this.h / scale);
                }

                ctx.restore();
            }
            
            // Check if point is inside the text's bounding box
            containsPoint(mx, my) {
                const localX = mx - this.x;
                const localY = my - this.y;
                
                // Check against unscaled dimensions (stored in this.w/h)
                return localX >= -(this.w / 2) && localX <= (this.w / 2) &&
                       localY >= -(this.h / 2) && localY <= (this.h / 2);
            }
        }

        // ----------------------------------------------------
        // IV. 初始化與主循環 (Init & Draw Loop)
        // ----------------------------------------------------

        function initCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            translateX = canvas.width / 2;
            translateY = canvas.height / 2;
            scale = 1;
            
            window.addEventListener('resize', resizeCanvas);
            
            // 初始範例圖形
            const r1 = new Shape('Rectangle', -100, 0, { w: 200, h: 100, color: '#fcd34d', alpha: 0.8 });
            // 移除 s1.mode = 'subtract'; 的設定
            const s1 = new Shape('Sector', 100, 0, { r: 100, angle: 90, color: '#ef4444', alpha: 0.9, rotation: Math.PI/2 });
            shapes.push(r1, s1);

            // 初始範例文字
            const t1 = new TextLabel("六年級數學", -200, -150, { fontSize: 30, color: '#6d28d9' });
            textLabels.push(t1);
            
            setupEventListeners();
            updateInteractionToolsUI(); // 替換 updatePenControls()
            
            requestAnimationFrame(drawLoop);
        }

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function drawAnnotations() {
            annotations.forEach(annotation => annotation.draw());

            // Draw the temporary straight line during drawing
            if (interactionMode === 'drawing' && drawingMode === 'straightLine' && straightLineStart && straightLineEnd) {
                ctx.strokeStyle = penColor;
                ctx.lineWidth = penWidth / scale;
                ctx.lineCap = 'square';
                
                ctx.beginPath();
                ctx.moveTo(straightLineStart.x, straightLineStart.y);
                ctx.lineTo(straightLineEnd.x, straightLineEnd.y);
                ctx.stroke();
            }
        }

        function drawLoop() {
            ctx.fillStyle = '#f9fafb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(translateX, translateY);
            ctx.scale(scale, scale);

            shapes.forEach(shape => shape.draw());
            drawAnnotations();
            textLabels.forEach(label => label.draw()); // 繪製文字標註
            
            // 移除 calculateTotalArea() 的調用

            ctx.restore();

            requestAnimationFrame(drawLoop);
        }

        // ----------------------------------------------------
        // VI. 事件處理器 (Event Handlers)
        // ----------------------------------------------------

        // 統一獲取事件位置 (支援滑鼠和觸控)
        function getEventPos(event) {
            // Use event.touches[0] for touch, or event for mouse
            const source = (event.touches && event.touches.length > 0) ? event.touches[0] : event;
            
            const rect = canvas.getBoundingClientRect();
            
            // Client positions are used for panning (mouse or touch screen position)
            const clientX = source.clientX;
            const clientY = source.clientY;

            // Canvas/World positions are used for interacting with shapes (relative to pan/zoom)
            const mouseX = (clientX - rect.left - translateX) / scale;
            const mouseY = (clientY - rect.top - translateY) / scale;

            return { x: mouseX, y: mouseY, clientX: clientX, clientY: clientY };
        }

        // --- 新增：管理工具列按鈕的 UI 狀態 ---
        function updateInteractionToolsUI() {
            const textBtn = document.getElementById('toggle-text-mode-btn');
            const drawBtn = document.getElementById('toggle-drawing-mode-btn');
            const eraserBtn = document.getElementById('toggle-eraser-mode-btn');
            
            const textControls = document.getElementById('text-controls');
            const penControls = document.getElementById('pen-controls');

            // 1. 重設所有按鈕樣式
            document.querySelectorAll('.interaction-mode-btn').forEach(btn => {
                btn.classList.remove('bg-blue-500', 'text-white', 'shadow-md');
                btn.classList.remove('bg-red-500'); 
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            
            // 2. 隱藏所有控制項
            textControls.classList.add('hidden');
            penControls.classList.add('hidden');
            
            let cursorStyle = 'default';

            // 3. 根據模式設定作用中按鈕的樣式和控制項
            if (isAddingText) {
                textBtn.classList.add('bg-blue-500', 'text-white', 'shadow-md');
                textBtn.classList.remove('bg-gray-200', 'text-gray-700');
                textControls.classList.remove('hidden');
                cursorStyle = 'text';
            } else if (interactionMode === 'drawing') {
                drawBtn.classList.add('bg-blue-500', 'text-white', 'shadow-md');
                drawBtn.classList.remove('bg-gray-200', 'text-gray-700');
                penControls.classList.remove('hidden');
                cursorStyle = 'crosshair';
            } else if (isErasing) {
                eraserBtn.classList.add('bg-red-500', 'text-white', 'shadow-md'); 
                eraserBtn.classList.remove('bg-gray-200', 'text-gray-700');
                cursorStyle = 'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'32\'><path d=\'M24.7 9.3l-12-12-12 12 12 12 12-12zM21.5 12.5l-9.5 9.5-9.5-9.5 9.5-9.5 9.5 9.5z\' fill=\'#000\' stroke=\'#fff\' stroke-width=\'2\'/></svg>"), auto';
            }
            // (如果是預設選取模式，則不執行任何操作，保持灰色和隱藏)
            
            // 更新游標
            canvas.style.cursor = cursorStyle;
        }


        function handleClearAnnotations() {
             if (confirm('確定要清除畫布上的所有手寫註記和文字標註嗎？')) {
                annotations = [];
                textLabels = [];
                clearSelection();
            }
        }
        
        // --- Utility Handlers (unchanged) ---

        function handleAddShape(event) {
            if (interactionMode === 'drawing' || isErasing || isAddingText) return; 

            const btn = event.currentTarget;
            const shapeType = btn.dataset.shape;
            
            let options = { color: btn.style.backgroundColor || btn.dataset.color || '#3b82f6', alpha: 0.7 };

            if (shapeType === 'Square') {
                options.w = options.h = parseFloat(btn.dataset.s) || 100;
            } else if (shapeType === 'Rectangle') {
                options.w = parseFloat(btn.dataset.w) || 120;
                options.h = parseFloat(btn.dataset.h) || 80;
            } else if (shapeType === 'Triangle') {
                options.w = parseFloat(btn.dataset.w) || 100;
                options.h = parseFloat(btn.dataset.h) || 100;
                options.apexOffset = parseFloat(btn.dataset.offset) || 0;
            } else if (shapeType === 'Parallelogram') {
                options.w = parseFloat(btn.dataset.w) || 100;
                options.h = parseFloat(btn.dataset.h) || 60;
                options.apexOffset = parseFloat(btn.dataset.offset) || 20;
            } else if (shapeType === 'Trapezoid') {
                options.w = parseFloat(btn.dataset.w) || 120; // w = bottom base
                options.w_top = parseFloat(btn.dataset.wTop) || 80; // w_top = top base
                options.h = parseFloat(btn.dataset.h) || 60;
            } else if (shapeType === 'Circle' || shapeType === 'Sector') {
                options.r = parseFloat(btn.dataset.r) || 50;
                if (shapeType === 'Sector') {
                    options.angle = parseFloat(btn.dataset.angle) || 90;
                }
            }

            const newShape = new Shape(shapeType, 0, 0, options);
            shapes.push(newShape);
            setSelectedShape(newShape);
        }

        function handleAddText() {
            if (isAddingText === false) return; // 僅在文字模式下新增

            const textInput = document.getElementById('text-input');
            const text = textInput.value.trim();
            if (!text) {
                alert('請輸入要標註的文字。');
                return;
            }
            const newText = new TextLabel(text, 0, 0); // Center of canvas (0,0 world coords)
            textLabels.push(newText);
            setSelectedText(newText);
            textInput.value = ''; // 清空輸入框
            
            // 新增：新增後自動退回選取模式
            isAddingText = false;
            updateInteractionToolsUI();
        }


        function handleClearCanvas() {
            if (confirm('確定要清除畫布上的所有圖形、註記和文字標註嗎？此操作無法復原。')) {
                shapes = [];
                annotations = [];
                textLabels = [];
                clearSelection();
            }
        }

        function handleResetView() {
            translateX = canvas.width / 2;
            translateY = canvas.height / 2;
            scale = 1;
        }

        function handleDeleteShape() {
            if (selectedShape) {
                const index = shapes.indexOf(selectedShape);
                if (index > -1) { shapes.splice(index, 1); }
                setSelectedShape(null);
            } else if (selectedAnnotation) {
                const index = annotations.indexOf(selectedAnnotation);
                if (index > -1) { annotations.splice(index, 1); }
                setSelectedAnnotation(null);
            } else if (selectedText) { // 新增
                 const index = textLabels.indexOf(selectedText);
                if (index > -1) { textLabels.splice(index, 1); }
                setSelectedText(null);
            }
        }
        
        // --- 複製功能 (新增) ---
        function handleDuplicateElement() {
            const offset = 20; // 複製後的偏移量

            if (selectedShape) {
                // 複製幾何圖形
                const original = selectedShape;
                const newShape = new Shape(original.type, original.x + offset, original.y + offset, {
                    rotation: original.rotation, 
                    color: original.color,
                    alpha: original.alpha,
                    r: original.r, 
                    w: original.w,
                    h: original.h,
                    w_top: original.w_top,
                    angle: original.angle, 
                    apexOffset: original.apexOffset
                });
                
                shapes.push(newShape);
                setSelectedShape(newShape);
            } else if (selectedAnnotation) {
                // 複製註記 (線條)
                const original = selectedAnnotation;
                const newAnnotation = new Annotation(
                    original.points.map(p => ({ x: p.x, y: p.y })), // 深度複製點陣列
                    original.color,
                    original.width,
                    original.x + offset,
                    original.y + offset
                );

                annotations.push(newAnnotation);
                setSelectedAnnotation(newAnnotation);
            } else if (selectedText) {
                // 複製文字標註
                const original = selectedText;
                const newText = new TextLabel(original.text, original.x + offset, original.y + offset, {
                    color: original.color,
                    fontSize: original.fontSize
                });

                textLabels.push(newText);
                setSelectedText(newText);
            }
        }
        // --- End 複製功能 ---

        // --- Layer Management Functions (Updated) ---

        function handleBringToFront() {
            if (!selectedShape) return;
            const index = shapes.indexOf(selectedShape);
            if (index > -1 && index !== shapes.length - 1) {
                shapes.splice(index, 1);
                shapes.push(selectedShape);
            }
        }

        function handleSendToBack() {
            if (!selectedShape) return;
            const index = shapes.indexOf(selectedShape);
            if (index > 0) {
                shapes.splice(index, 1);
                shapes.unshift(selectedShape); // Insert at the beginning (index 0)
            }
        }

        function handleMoveUp() {
            if (!selectedShape) return;
            const index = shapes.indexOf(selectedShape);
            if (index > -1 && index < shapes.length - 1) {
                // Swap with the element above it
                [shapes[index], shapes[index + 1]] = [shapes[index + 1], shapes[index]];
            }
        }

        function handleMoveDown() {
            if (!selectedShape) return;
            const index = shapes.indexOf(selectedShape);
            if (index > 0) {
                // Swap with the element below it
                [shapes[index], shapes[index - 1]] = [shapes[index - 1], shapes[index]];
            }
        }
        
        // --- End Layer Management ---
        
        // --- 核心屬性調整 (unchanged) ---

        // 新增：僅更新 UI 的輔助函數
        function updateApexOffsetUI(offset, baseWidth) {
            const offsetInput = document.getElementById('shape-apex-offset-value');
            const offsetSlider = document.getElementById('shape-apex-offset-slider');
            
            // 計算比例，用於滑桿顯示 (相對於底邊寬度一半)
            // 避免 baseWidth 為 0 導致除法錯誤
            const halfBase = baseWidth / 2;
            const offsetRatio = (halfBase !== 0) ? (offset / halfBase) * 50 : 0; 
            
            offsetInput.value = offset.toFixed(0); // 顯示實際公分數值
            offsetSlider.value = offsetRatio.toFixed(0); // 顯示比例值 (映射到 -50到50)
            
            document.getElementById('offset-display').textContent = `${offset.toFixed(2)} (約 ${offsetRatio.toFixed(0)}%)`;
        }

        function handleApexOffsetChange(newOffsetValue, isSlider) {
            if (!selectedShape || (selectedShape.type !== 'Triangle' && selectedShape.type !== 'Parallelogram')) return;

            const baseWidth = selectedShape.w;
            let offset;
            let offsetRatio; // 映射到 -50到50 的滑桿值
            
            if (isSlider) {
                // 從滑桿 (-50 to 50) 更新實際公分數
                offsetRatio = parseFloat(newOffsetValue);
                // 將比例值映射回實際的公分數 (-w/2 到 w/2)
                offset = (offsetRatio / 50) * (baseWidth / 2);
            } else {
                // 從數值輸入框 (公分數值) 更新
                offset = parseFloat(newOffsetValue);
            // 限制最大偏移量為底邊寬度的一半 (對三角形) 或 1.5 倍 (對平行四邊形)
            const maxOffset = (selectedShape.type === 'Triangle') ? (baseWidth / 2) : (baseWidth * 1.5);
            offset = Math.min(maxOffset, Math.max(-maxOffset, offset)); 
                
            // 計算比例值，用於更新滑桿
            const halfBase = baseWidth / 2;
            offsetRatio = (halfBase !== 0) ? (offset / halfBase) * 50 : 0;
            }

            selectedShape.apexOffset = offset;
            
            // 更新 UI 顯示 (使用新的輔助函數)
            updateApexOffsetUI(offset, baseWidth);

            updatePropertyPanel(); // 觸發重繪 (但會再次調用 updateApexOffsetUI，沒關係)
        }


        function handlePropertyChange(event) {
            if (!selectedShape) return;

            const value = event.target.value;
            const id = event.target.id;
            
            switch (id) {
                case 'shape-color':
                    selectedShape.color = value;
                    break;
                case 'shape-alpha':
                    selectedShape.alpha = parseFloat(value);
                    document.getElementById('alpha-display').textContent = `${Math.round(selectedShape.alpha * 100)}%`;
                    break;
                case 'shape-dim1':
                    if (selectedShape.type === 'Circle' || selectedShape.type === 'Sector') {
                        selectedShape.r = parseFloat(value);
                    } else if (selectedShape.type === 'Square') {
                        selectedShape.w = selectedShape.h = parseFloat(value);
                    } else if (selectedShape.type === 'Rectangle' || selectedShape.type === 'Triangle' || selectedShape.type === 'Parallelogram' || selectedShape.type === 'Trapezoid') {
                        selectedShape.w = parseFloat(value);
                    }
                    // 如果是三角形或平行四邊形，寬度改變需要重新計算 apexOffset 的限制和比例
                    if (selectedShape.type === 'Triangle' || selectedShape.type === 'Parallelogram') {
                        handleApexOffsetChange(selectedShape.apexOffset, false); 
                    }
                    break;
                case 'shape-dim2':
                    if (selectedShape.type === 'Rectangle' || selectedShape.type === 'Triangle' || selectedShape.type === 'Parallelogram' || selectedShape.type === 'Trapezoid') {
                        selectedShape.h = parseFloat(value);
                    }
                    break;
                case 'shape-dim-top': // 梯形上底
                    if (selectedShape.type === 'Trapezoid') {
                        selectedShape.w_top = parseFloat(value);
                    }
                    break;
                case 'shape-apex-offset-value': // 數值輸入框
                    handleApexOffsetChange(value, false); 
                    return; // 已經處理完畢
                case 'shape-apex-offset-slider': // 滑桿
                    handleApexOffsetChange(value, true); 
                    return; // 已經處理完畢
                case 'sector-angle':
                    selectedShape.angle = Math.min(360, Math.max(1, parseFloat(value)));
                    break;
            }
            
            updatePropertyPanel();
        }
        
        function handleTextPropertyChange(event) { // 新增
            if (!selectedText) return;

            const value = event.target.value;
            const id = event.target.id;

            switch (id) {
                case 'text-content-edit':
                    selectedText.text = value;
                    break;
                case 'text-color':
                    selectedText.color = value;
                    break;
                case 'text-font-size':
                    selectedText.fontSize = parseInt(value, 10);
                    document.getElementById('font-size-display').textContent = selectedText.fontSize;
                    break;
            }
            // Text property changes do not affect area, only redrawing is needed
        }

        
        // --- Core Mouse/Touch Handlers ---

        function handleMouseDown(event) {
            // 觸控事件不需要 mouse down, 由 touchstart 處理
            // if (event.touches) return; // <--- 移除此行檢查，以允許來自 handleTouchStart 的偽事件 (pseudo-event)
            
            event.preventDefault();
            const pos = getEventPos(event);
            const eraseTolerance = 30 / scale;

            if (isErasing) {
                isDrawing = true;
                const erasePoint = { x: pos.x, y: pos.y };
                annotations = annotations.filter(ann => !ann.containsPoint(erasePoint.x, erasePoint.y, eraseTolerance));
                textLabels = textLabels.filter(txt => !txt.containsPoint(erasePoint.x, erasePoint.y, eraseTolerance));
                return;
            }

            if (interactionMode === 'drawing') {
                isDrawing = true;
                if (drawingMode === 'freehand') {
                    currentAnnotation = { points: [pos], color: penColor, width: penWidth };
                } else if (drawingMode === 'straightLine') {
                    straightLineStart = pos;
                    straightLineEnd = pos;
                }
                clearSelection();
                return;
            }
            
            // 1. Check Controls (only on selectedShape)
            if (selectedShape) {
                const controlType = selectedShape.checkControls(pos.x, pos.y);
                if (controlType === 'resize') { isResizing = true; return; } 
                if (controlType === 'rotate') { isRotating = true; return; }
            }
            
            // 2. Check Text Label Selection/Drag (最高優先級，確保文字易於選取)
            let foundText = null;
            for (let i = textLabels.length - 1; i >= 0; i--) {
                if (textLabels[i].containsPoint(pos.x, pos.y)) {
                    foundText = textLabels[i];
                    break;
                }
            }
            if (foundText) {
                isDragging = true;
                setSelectedText(foundText);
                dragOffsetX = pos.x - foundText.x;
                dragOffsetY = pos.y - foundText.y;
                canvas.style.cursor = 'move';
                return;
            }

            // 3. Check Geometric Shape Selection/Drag
            let foundShape = null;
            for (let i = shapes.length - 1; i >= 0; i--) {
                if (shapes[i].containsPoint(pos.x, pos.y)) {
                    foundShape = shapes[i];
                    break;
                }
            }
            if (foundShape) {
                isDragging = true;
                setSelectedShape(foundShape);
                dragOffsetX = pos.x - foundShape.x;
                dragOffsetY = pos.y - foundShape.y;
                canvas.style.cursor = 'move';
                return;
            }

            // 4. Check Annotation Selection/Drag
            let foundAnnotation = null;
            for (let i = annotations.length - 1; i >= 0; i--) {
                if (annotations[i].containsPoint(pos.x, pos.y)) {
                    foundAnnotation = annotations[i];
                    break;
                }
            }
            if (foundAnnotation) {
                isDragging = true;
                setSelectedAnnotation(foundAnnotation);
                dragOffsetX = pos.x - foundAnnotation.x;
                dragOffsetY = pos.y - foundAnnotation.y;
                canvas.style.cursor = 'move';
                return;
            }

            // 5. Start Panning
            clearSelection();
            isPanning = true;
            dragOffsetX = pos.clientX - translateX;
            dragOffsetY = pos.clientY - translateY;
            canvas.style.cursor = 'grab';
        }

        function handleMouseMove(event) {
            // 觸控事件不需要 mouse move
            // if (event.touches) return; // <--- 移除此行檢查

            const pos = getEventPos(event);
            const eraseTolerance = 30 / scale;

            // 橡皮擦模式：持續清除
            if (isErasing && isDrawing) {
                const erasePoint = { x: pos.x, y: pos.y };
                annotations = annotations.filter(ann => !ann.containsPoint(erasePoint.x, erasePoint.y, eraseTolerance));
                textLabels = textLabels.filter(txt => !txt.containsPoint(erasePoint.x, erasePoint.y, eraseTolerance));
                return;
            }

            // Drawing Mode: Update current line points
            if (interactionMode === 'drawing' && isDrawing) {
                if (drawingMode === 'freehand') {
                    if (currentAnnotation) { currentAnnotation.points.push(pos); }
                } else if (drawingMode === 'straightLine') {
                    straightLineEnd = pos;
                }
                return;
            }

            // Interaction Mode: Drag/Resize/Pan Logic
            if (isResizing && selectedShape) {
                const dx = pos.x - selectedShape.x;
                const dy = pos.y - selectedShape.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (selectedShape.type === 'Circle' || selectedShape.type === 'Sector') {
                    selectedShape.r = dist;
                } else {
                    const scaleFactor = dist / Math.sqrt(selectedShape.w * selectedShape.w / 4 + selectedShape.h * selectedShape.h / 4);
                    selectedShape.w *= scaleFactor;
                    selectedShape.h *= scaleFactor;
                }
                updatePropertyPanel();
            } else if (isRotating && selectedShape) {
                const angle = Math.atan2(pos.y - selectedShape.y, pos.x - selectedShape.x);
                selectedShape.rotation = angle + Math.PI / 2; 
                updatePropertyPanel();
            } else if (isDragging) {
                if (selectedShape) {
                    selectedShape.x = pos.x - dragOffsetX;
                    selectedShape.y = pos.y - dragOffsetY;
                } else if (selectedAnnotation) {
                    selectedAnnotation.x = pos.x - dragOffsetX;
                    selectedAnnotation.y = pos.y - dragOffsetY;
                } else if (selectedText) { // 新增
                    selectedText.x = pos.x - dragOffsetX;
                    selectedText.y = pos.y - dragOffsetY;
                }
            } else if (isPanning) {
                translateX = pos.clientX - dragOffsetX;
                translateY = pos.clientY - dragOffsetY;
            } else {
                // Preview Cursor (Mouse only)
                let controlType = (selectedShape) ? selectedShape.checkControls(pos.x, pos.y) : null;

                if (isErasing) { canvas.style.cursor = 'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'32\'><path d=\'M24.7 9.3l-12-12-12 12 12 12 12-12zM21.5 12.5l-9.5 9.5-9.5-9.5 9.5-9.5 9.5 9.5z\' fill=\'#000\' stroke=\'#fff\' stroke-width=\'2\'/></svg>"), auto'; }
                else if (interactionMode === 'drawing') { canvas.style.cursor = 'crosshair'; }
                else if (controlType === 'resize') { canvas.style.cursor = 'nwse-resize'; } 
                else if (controlType === 'rotate') { canvas.style.cursor = 'crosshair'; } 
                else if (selectedShape || selectedAnnotation || selectedText) { canvas.style.cursor = 'move'; } 
                else { canvas.style.cursor = 'default'; }
            }
        }

        function handleMouseUp(event) {
            // 觸控事件不需要 mouse up, 由 touchend 處理
            // if (event.touches) return; // <--- 移除此行檢查

            // Drawing Finalization
            if (interactionMode === 'drawing' && isDrawing) {
                if (drawingMode === 'freehand') {
                    if (currentAnnotation && currentAnnotation.points.length > 1) {
                        createAnnotation(currentAnnotation.points, currentAnnotation.color, currentAnnotation.width);
                    }
                } else if (drawingMode === 'straightLine' && straightLineStart && straightLineEnd) {
                    const points = [straightLineStart, straightLineEnd];
                    createAnnotation(points, penColor, penWidth);
                    straightLineStart = null;
                    straightLineEnd = null;
                }
            }

            isDragging = false;
            isResizing = false;
            isRotating = false;
            isPanning = false;
            isDrawing = false;
            currentAnnotation = null;

            // Reset cursor after erasing/drawing
            if (!isErasing && interactionMode === 'drawing') {
                canvas.style.cursor = 'crosshair';
            } else if (!isErasing && interactionMode === 'geometry') {
                canvas.style.cursor = 'default';
            }
        }
        
        // --- Touch Handlers (Wrapping Mouse/Core logic) ---
        function handleTouchStart(event) {
            event.preventDefault(); // Prevent default browser scroll/zoom on touch
            if (event.touches.length > 1) {
                // Multi-touch gestures are ignored for now, focusing on single-touch interactions
                return;
            }
            const touch = event.touches[0];
            // Create a pseudo-mouse event for the core handler
            const pseudoEvent = {
                clientX: touch.clientX,
                clientY: touch.clientY,
                preventDefault: function() { event.preventDefault(); }, // 修正：正確包裝 preventDefault
                touches: event.touches, 
                ctrlKey: false, 
                metaKey: false
            };
            handleMouseDown(pseudoEvent);
        }

        function handleTouchMove(event) {
            event.preventDefault();
            if (event.touches.length > 1) return;
            
            const touch = event.touches[0];
            const pseudoEvent = {
                clientX: touch.clientX,
                clientY: touch.clientY,
                preventDefault: function() { event.preventDefault(); }, // 修正：正確包裝 preventDefault
                touches: event.touches 
            };
            handleMouseMove(pseudoEvent);
        }

        function handleTouchEnd(event) {
            // When a touch ends, call handleMouseUp. It signals the end of drag/draw.
            handleMouseUp(event);
        }
        // --- End Touch Handlers ---


        function handleWheel(event) {
            event.preventDefault();
            const scaleFactor = 1.1;
            
            if (event.ctrlKey || event.metaKey) {
                const pos = getEventPos(event);
                const oldScale = scale;
                scale = event.deltaY < 0 ? scale * scaleFactor : scale / scaleFactor;
                
                translateX = pos.x * scale - pos.x * oldScale + translateX;
                translateY = pos.y * scale - pos.y * oldScale + translateY;
            } else {
                translateY -= event.deltaY;
            }
        }

        function setupEventListeners() {
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
            canvas.addEventListener('wheel', handleWheel); 
            
            // 綁定觸控事件
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd);
            
            document.querySelectorAll('.add-shape-btn').forEach(button => {
                button.addEventListener('click', handleAddShape);
            });
            
            document.getElementById('add-text-btn').addEventListener('click', handleAddText); // 新增
            document.getElementById('delete-text-btn').addEventListener('click', handleDeleteShape); // 使用通用刪除
            
            // 綁定複製按鈕
            document.getElementById('duplicate-shape-btn').addEventListener('click', handleDuplicateElement);
            document.getElementById('duplicate-text-btn').addEventListener('click', handleDuplicateElement);


            // --- 更新的工具列事件綁定 ---
            document.getElementById('toggle-text-mode-btn').addEventListener('click', handleToggleTextMode); // 新增
            document.getElementById('toggle-drawing-mode-btn').addEventListener('click', handleToggleDrawingMode);
            document.getElementById('toggle-eraser-mode-btn').addEventListener('click', handleToggleEraserMode); 
            // --- (舊的 'toggle-interaction-mode-btn' 已被移除) ---

            document.querySelectorAll('.pen-mode-btn').forEach(btn => btn.addEventListener('click', handlePenModeChange));
            document.getElementById('pen-color').addEventListener('input', (e) => { penColor = e.target.value; });
            document.getElementById('pen-width').addEventListener('input', (e) => {
                penWidth = parseInt(e.target.value, 10);
                document.getElementById('width-display').textContent = penWidth;
            });
            document.getElementById('clear-annotations-btn').addEventListener('click', handleClearAnnotations);

            document.getElementById('delete-shape-btn').addEventListener('click', handleDeleteShape);
            
            // 綁定新的圖層控制按鈕
            document.getElementById('bring-to-front-btn').addEventListener('click', handleBringToFront);
            document.getElementById('send-to-back-btn').addEventListener('click', handleSendToBack);
            document.getElementById('move-up-btn').addEventListener('click', handleMoveUp);
            document.getElementById('move-down-btn').addEventListener('click', handleMoveDown);
            
            document.getElementById('shape-color').addEventListener('input', handlePropertyChange);
            document.getElementById('shape-alpha').addEventListener('input', handlePropertyChange);
            document.getElementById('shape-dim1').addEventListener('input', handlePropertyChange);
            document.getElementById('shape-dim2').addEventListener('input', handlePropertyChange);
            document.getElementById('shape-dim-top').addEventListener('input', handlePropertyChange); // 綁定梯形上底
            
            // 三角形頂點偏移控制 (新增/修改)
            document.getElementById('shape-apex-offset-value').addEventListener('input', handlePropertyChange); 
            document.getElementById('shape-apex-offset-slider').addEventListener('input', handlePropertyChange); // <--- 補回：缺失的滑桿監聽
            
            document.getElementById('sector-angle').addEventListener('input', handlePropertyChange);
            // 移除 mode-btn 的事件監聽器
            // document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click', handleModeChange));
            document.getElementById('clear-canvas-btn').addEventListener('click', handleClearCanvas);
            document.getElementById('reset-view-btn').addEventListener('click', handleResetView);
            
            // 文字編輯事件監聽 (新增)
            document.getElementById('text-content-edit').addEventListener('input', handleTextPropertyChange);
            document.getElementById('text-color').addEventListener('input', handleTextPropertyChange);
            document.getElementById('text-font-size').addEventListener('input', handleTextPropertyChange);
            
            // --- 新增：圖形工具箱收合選單 ---
            document.getElementById('toggle-shape-palette-btn').addEventListener('click', () => {
                const palette = document.getElementById('shape-palette');
                const arrow = document.getElementById('shape-palette-arrow');
                
                // 切換 'hidden' class 來顯示/隱藏
                palette.classList.toggle('hidden');
                
                // 切換箭頭方向
                // rotate-180 (向上) 是收合, 預設 (向下) 是展開
                arrow.classList.toggle('rotate-180'); 
            });
        } 
        
        // 啟動應用程式
        window.onload = () => {
            initCanvas();
            // 預設啟動選取模式 (已在 initCanvas 中調用)
            // updateInteractionToolsUI(); 
        }; 

    </script>
</body>
</html>
